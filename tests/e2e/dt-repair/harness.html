<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>DT guided self-repair: sheet harness</title>
<!-- Loads the REAL stylesheet and script of the feature, with the app's own CSS underneath
     (Bootstrap reboot + Still Water tokens), against a stand-in API (mock-api.js).
     Query: scenario=<name> daily=en|zh theme=midnight ui=en|zh|ja auto=<ms> lat=<ms> fast
     Used by tests/e2e/dt-repair/noscroll.cjs and by the screenshot run. -->
<link rel="stylesheet" href="../../../static/vendor/bootstrap-5.3.2/css/bootstrap.min.css">
<link rel="stylesheet" href="../../../static/css/styles.css">
<link rel="stylesheet" href="../../../static/css/dt-repair.css">
<style>
  html, body { height: 100%; margin: 0; overflow: hidden; }
  .ex { height: 100dvh; max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; padding: 0 20px; }
  .ex-hd { flex: none; height: 52px; display: flex; align-items: center; font-family: var(--font-display); font-weight: 700; color: var(--primary); }
  .ex-main { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; gap: 12px; overflow: hidden; }
  .ex h1 { font-family: var(--font-display); font-size: 1.375rem; margin: 4px 0 0; }
  .box { border: 1px solid var(--border-default); background: var(--bg-surface); border-radius: 14px; padding: 12px 14px; overflow: hidden; }
  .box p { margin: 0; }
  .ex-act { flex: none; padding: 12px 0 calc(10px + env(safe-area-inset-bottom)); display: flex; gap: 8px; align-items: center; }
  .ex-act button { min-height: 44px; }
  .ex-act select { min-height: 44px; max-width: 180px; }
</style>
</head>
<body>
<div class="ex" id="ex">
  <div class="ex-hd">LinguaLoop</div>
  <div class="ex-main">
    <h1 id="exTitle">Translate</h1>
    <div class="box"><p id="exSrc"></p></div>
    <div class="box"><p id="exMine"></p></div>
  </div>
  <div class="ex-act">
    <button class="btn btn-primary" id="submit" type="button">Submit</button>
    <button class="btn btn-link" id="daily" type="button">Daily practice</button>
    <label><span class="visually-hidden">Scenario</span><select id="scen"></select></label>
  </div>
</div>

<script src="./mock-api.js"></script>
<script>
  const Q = new URLSearchParams(location.search);
  if (Q.get('theme') === 'midnight') document.documentElement.setAttribute('data-theme', 'midnight');
  if (Q.has('fast')) document.documentElement.classList.add('dtr-noanim');

  // A stand-in for LinguaI18n that reads the app's real locale files (injected by the test runner).
  const BUNDLES = window.__I18N || {};
  const UI = Q.get('ui') || 'en';
  window.LinguaI18n = {
    t(key, params) {
      let v = (BUNDLES[UI] || {})[key] || (BUNDLES.en || {})[key];
      if (v === undefined) return key;
      if (params) Object.keys(params).forEach((k) => { v = v.replace(new RegExp('\\{' + k + '\\}', 'g'), params[k]); });
      return v;
    },
    currentLanguage: () => UI,
  };
  document.documentElement.lang = UI;
  window.__done = [];

  const sel = document.getElementById('scen');
  Object.keys(DTRepairMock.SCENARIOS).forEach((k) => sel.add(new Option(k, k)));
  sel.value = Q.get('scenario') || 'en_errors';
  function drawEx() {
    const sc = DTRepairMock.SCENARIOS[sel.value] || DTRepairMock.SCENARIOS.en_errors;
    document.getElementById('exSrc').textContent = sc.passage;
    document.getElementById('exMine').textContent = (sc.steps || []).map((k) => DTRepairMock.X[k].text).join(' ') || '…';
  }
  sel.onchange = drawEx;
  drawEx();

  function onDone(r) {
    window.__done.push(r);
    document.getElementById('exTitle').textContent = 'Translate';
    document.getElementById('ex').dataset.done = JSON.stringify(r);
  }
  function lat() {
    return Q.has('lat') ? Number(Q.get('lat')) : Q.has('fast') ? 5 : 40;
  }
  function auto() {
    return Q.has('auto') ? { autoAdvanceMs: Number(Q.get('auto')) } : {};
  }
  document.getElementById('submit').onclick = (e) => {
    const mock = (window.H.mock = DTRepairMock.create(sel.value, Object.assign({ latency: lat() }, auto())));
    window.H.sheet = DTRepairSheet.open({
      mode: 'pass',
      session: mock.session,
      fetch: mock.fetch,
      returnFocus: e.currentTarget,
      autoAdvance: Q.has('auto'),
      onDone,
    });
  };
  document.getElementById('daily').onclick = (e) => {
    const name = 'daily_' + (Q.get('daily') || 'en');
    const mock = (window.H.mock = DTRepairMock.create(name, { latency: lat() }));
    window.H.sheet = DTRepairSheet.open({
      mode: 'daily',
      items: mock.items,
      l2: mock.l2,
      fetch: mock.fetch,
      returnFocus: e.currentTarget,
      autoAdvance: Q.has('auto'),
      onDone,
    });
  };
  window.H = { mock: null, sheet: null };
</script>
<script src="../../../static/js/dt-repair-sheet.js"></script>
</body>
</html>
