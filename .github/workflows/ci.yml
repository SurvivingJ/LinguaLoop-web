name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: pytest
    runs-on: ubuntu-latest
    env:
      # Placeholders: the suite mocks every external service. The keys only
      # need the three-part shape the Supabase client checks at construction.
      SECRET_KEY: ci-secret-key
      SUPABASE_URL: https://ci-placeholder.supabase.co
      SUPABASE_KEY: ci.anon.key
      SUPABASE_SERVICE_ROLE_KEY: ci.service.key
      DISABLE_SCHEDULER: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Ruff (pyflakes rules, not yet blocking)
        continue-on-error: true
        run: ruff check .

      # The two deselected tests read prompt_templates from the live database
      # and cannot run on placeholder credentials.
      - name: pytest
        run: >
          python -m pytest -q
          --deselect tests/test_ladder_validation_profiles.py::test_ja_p1_prompt_enumerates_exactly_the_profile_pos_set
          --deselect tests/test_provider_routing_and_reasoning.py::test_no_active_vocab_ladder_model_resolves_to_a_reasoning_class_model

  frontend:
    name: vitest + eslint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Vitest
        run: npm run test:unit
