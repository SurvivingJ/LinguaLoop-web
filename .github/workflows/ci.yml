name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: pytest
    runs-on: ubuntu-latest
    env:
      # Placeholders: the suite mocks every external service. The keys only
      # need the three-part shape the Supabase client checks at construction.
      SECRET_KEY: ci-secret-key
      SUPABASE_URL: https://ci-placeholder.supabase.co
      SUPABASE_KEY: ci.anon.key
      SUPABASE_SERVICE_ROLE_KEY: ci.service.key
      DISABLE_SCHEDULER: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      # Blocking gate: `ruff check .` is clean, keep it that way.
      - name: Ruff (pyflakes rules)
        run: ruff check .

      # Tests marked `live` (they read the live database) skip unless selected
      # with -m live; tests/conftest.py keeps every other test away from a real
      # Supabase client whatever credentials are set.
      - name: pytest
        run: python -m pytest -q

  frontend:
    name: vitest + eslint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Vitest
        run: npm run test:unit
