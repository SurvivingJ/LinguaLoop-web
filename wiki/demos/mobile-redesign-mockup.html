  const me={s,onDone:o.onDone,
   view(){if(s.k>=idx.length){s.frozen=s.frozen||Date.now()-s.t0;const pc=pct(idx.length,idx.length+s.mist);return resultCard('Pinyin Tones',l.g.tone,pc,'Tone Accuracy',[['Characters',`${idx.length}/${idx.length}`],['Time',mmss(s.frozen/1000)],['Mistakes',s.mist],['ELO Change',pc>=80?'+9':'−5']])}
    return frame({title:tl(t.title),sub:`${l.name} · Pinyin`,gl:l.g.tone,right:`<span data-clock>0:00</span> <button class="link" data-act="intro" aria-label="About this test">ⓘ</button>`,
      stage:`<div class="bar"><i style="width:${s.k/idx.length*100}%"></i></div><div class="swipe"><p class="trainer" lang="zh-CN">${items.map((x,i)=>{if(!Array.isArray(x))return x;const pos=idx.indexOf(i);
        return pos<s.k?`<ruby class="c${x[2]}">${x[0]}<rt class="c${x[2]}">${tone(x[1],x[2])}</rt></ruby>`:pos===s.k?`<span class="cur ${s.bad===pos?'shake':''}">${x[0]}</span>`:x[0]}).join('')}</p><p class="hint">Swipe anywhere here: → 1st · ↑ 2nd · ← 3rd · ↓ 4th. Tap for neutral.<br>The buttons below and the arrow keys work too.</p></div>`,
      dock:`<div class="tonepad">${[['→','1st','ā'],['↑','2nd','á'],['←','3rd','ǎ'],['↓','4th','à'],['·','neutral','a']].map((b,i)=>`<button data-act="tone" data-v="${i+1}" aria-label="Tone ${b[1]}"><b class="c${i+1}">${b[2]}</b>${b[1]}</button>`).join('')}</div>`})},
   key(e){const m={ArrowRight:1,ArrowUp:2,ArrowLeft:3,ArrowDown:4,' ':5}[e.key];if(m&&$('#sheet').hidden){e.preventDefault();me.acts.tone(m)}},
   swipe(d){if(s.k<idx.length)me.acts.tone({right:1,up:2,left:3,down:4,tap:5}[d])},
   acts:{tone(v){const x=items[idx[s.k]];if(!x)return;if(+v===x[2]){s.bad=-1;s.k++;render();return}
      s.mist++;s.bad=s.k;render();sheet(`<p class="prompt big" lang="zh-CN">${x[0]}</p><p class="center muted">${tone(x[1],x[2])}</p><p class="center"><b class="c${v}">Your answer ${v==5?'neutral':v}</b> → <b class="c${x[2]}">Correct ${x[2]===5?'neutral':x[2]}</b></p>${x[3]?`<div class="note"><b>Tone Sandhi Rule:</b> ${x[3]}</div>`:''}<button class="btn" data-act="closeSheet">Continue</button><p class="hint">You’ll answer this character again.</p>`)},
    intro(){introSheet('tone_zh')},retry(){Object.assign(s,{k:0,mist:0,t0:Date.now(),frozen:0,bad:-1});render()},fin(){close('done')}}};
  return me}

/* ---------- pitch accent trainer (ja) ---------- */
function PitchTrainer(t,o={}){const l=L(),items=l.pitchPassage,idx=items.map((x,i)=>Array.isArray(x)?i:-1).filter(i=>i>=0);
  const s={k:0,mist:0,t0:Date.now(),mode:'quick',furi:false,hl:[],msg:''};
  if(!S.introSeen.tone){S.introSeen.tone=1;setTimeout(()=>introSheet('tone_ja'),0)}
  const classify=(a,n)=>Object.keys(PITCH).filter(k=>k!=='naka'||n>2).find(k=>levels(k,n).join()===a.join());
  function wrong(x,mine){s.mist++;const n=x[1].length;sheet(`<p class="prompt big" lang="ja">${x[0]}</p><p class="center muted">${x[1].join('')}</p><p class="center"><b>${mine?PITCH[mine][1]:'Your contour'}</b> → <b style="color:var(--good)">${PITCH[x[2]][1]}</b></p><div class="cv">${contour(levels(x[2],n),x[1])}</div><div class="note"><b>${PITCH[x[2]][1]} — ${PITCH[x[2]][2]}</b></div><button class="btn" data-act="closeSheet">Continue</button><p class="hint">You’ll answer this word again.</p>`)}
  const me={s,onDone:o.onDone,
   view(){if(s.k>=idx.length){s.frozen=s.frozen||Date.now()-s.t0;const pc=pct(idx.length,idx.length+s.mist);return resultCard('Pitch Accent',l.g.tone,pc,'Accent accuracy',[['Words',`${idx.length}/${idx.length}`],['Time',mmss(s.frozen/1000)],['Mistakes',s.mist],['ELO change',pc>=80?'+9':'−5']])}
    const x=items[idx[s.k]],n=x[1].length,types=Object.keys(PITCH).filter(k=>k!=='naka'||n>2),full=s.hl.length===n+1&&s.hl.every(v=>v!=null);
    const ctrl=s.mode==='quick'?`<div class="opts two">${types.map((k,i)=>`<button class="opt contour" data-act="quick" data-v="${k}">${contour(levels(k,n),x[1])}<span>${'←↑→↓'[['heiban','atama','naka','odaka'].indexOf(k)]} ${PITCH[k][1]} <small lang="ja">${PITCH[k][0]}</small></span></button>`).join('')}</div>`
      :`<p class="small muted">Tap HIGH or LOW for each mora, then Submit.</p><div class="hl-grid" style="grid-template-columns:44px repeat(${n+1},1fr)">${['HIGH','LOW'].map((lab,r)=>`<span>${lab}</span>${Array.from({length:n+1},(_,i)=>`<button class="${s.hl[i]===1-r?'sel':''}" data-act="hl" data-v="${i},${1-r}" lang="ja">${i===n?'が':x[1][i]}</button>`).join('')}`).join('')}</div>${s.msg?`<p class="note warn">${s.msg}</p>`:''}`;
    return frame({title:tl(t.title),sub:`${l.name} · Pitch Accent`,gl:l.g.tone,right:`<span data-clock>0:00</span> <button class="link" data-act="intro" aria-label="About this test">ⓘ</button>`,
      stage:`<div class="row between"><div class="seg"><button class="${s.mode==='quick'?'on':''}" data-act="pmode" data-v="quick">⚡ Quick</button><button class="${s.mode==='contour'?'on':''}" data-act="pmode" data-v="contour">📈 Contour</button></div><button class="row small" data-act="furi" title="Halves the ELO change"><span class="sw ${s.furi?'on':''}"></span>ふりがな</button></div>
        <div class="swipe" style="flex:none"><p class="trainer" lang="ja" style="font-size:22px;line-height:2.2">${items.map((y,i)=>{if(!Array.isArray(y))return y;const pos=idx.indexOf(i),ci={heiban:4,atama:1,naka:2,odaka:3}[y[2]];
          return pos<s.k?`<ruby class="c${ci}">${y[0]}<rt class="c${ci}">${y[1].join('')}</rt></ruby>`:pos===s.k?`<ruby class="cur" style="font-size:30px">${y[0]}<rt>${s.furi?y[1].join(''):''}</rt></ruby>`:y[0]}).join('')}</p></div>${ctrl}`,
      dock:s.mode==='contour'?`<button class="btn" data-act="subc" ${full?'':'disabled'}>Submit</button>`:'<p class="hint">Tap a pattern, or swipe on the sentence: ← Heiban · ↑ Atamadaka · → Nakadaka · ↓ Odaka.</p>'})},
   swipe(d){const k={left:'heiban',up:'atama',right:'naka',down:'odaka'}[d],x=items[idx[s.k]];if(s.mode==='quick'&&k&&x&&(k!=='naka'||x[1].length>2))me.acts.quick(k)},
   acts:{pmode(v){s.mode=v;s.hl=[];s.msg='';render()},furi(){s.furi=!s.furi;if(s.furi)toast('Furigana on: the ELO change is halved.');render()},
    quick(v){const x=items[idx[s.k]];if(v===x[2]){s.k++;render()}else wrong(x,v)},
    hl(v){const[i,h]=v.split(',').map(Number);s.hl[i]=h;s.msg='';render()},
    subc(){const x=items[idx[s.k]],a=s.hl,n=x[1].length;let drops=0,fell=false,rise=false;for(let i=1;i<a.length;i++){if(a[i-1]===1&&a[i]===0){drops++;fell=true}if(a[i-1]===0&&a[i]===1&&fell)rise=true}
      if(n>1&&a[0]===a[1]){s.msg='Mora 1 and mora 2 must differ in pitch.';render();return}
      if(rise){s.msg='Pitch cannot rise again after it has fallen.';render();return}
      if(drops>1){s.msg='A Japanese word has at most one H->L drop.';render();return}
      const mine=classify(a,n);s.hl=[];if(mine===x[2]){s.k++;render();return}
      if(!mine)toast('Close - your contour is valid, but the drop is in the wrong place.');render();wrong(x,mine)},
    intro(){introSheet('tone_ja')},retry(){Object.assign(s,{k:0,mist:0,t0:Date.now(),frozen:0,hl:[]});render()},fin(){close('done')}}};
  return me}

/* ---------- measure words (zh) / counters (ja) ---------- */
function CounterDrill(o={}){const l=L(),zh=S.lang==='zh',items=l.drill,LV=['MC','MC','Type','Reverse','MC','Type','MC','Reverse'];
  const s={mode:zh?'auto':'choose',i:0,right:0,fb:null,inp:'',t0:Date.now(),opts:null,sel:null};
  const kind=()=>s.mode==='type'?'Type':s.mode==='choose'?'MC':LV[s.i%LV.length];
  function load(){const x=items[s.i],k=kind();s.sel=null;s.fb=null;s.inp='';
    if(k==='Reverse'){const others=shuffle(items.filter(y=>y[3]!==x[3])).slice(0,3);s.opts=shuffle([x,...others]).map(y=>({t:y[0],sub:y[1],ok:y===x}))}
    else{const cls=[...new Map(items.map(y=>[y[3],y])).values()].filter(y=>y[3]!==x[3]);s.opts=shuffle([x,...shuffle(cls).slice(0,3)]).map(y=>({t:y[3],sub:zh?y[4]:y[7]||y[4],ok:y[3]===x[3]}))}}
  load();
  function answer(ok,given){if(ok)s.right++;s.fb={ok,given};render();if(ok&&zh)setTimeout(()=>{if(P===me&&s.fb&&s.fb.ok)me.acts.next()},450)}
  const me={s,onDone:o.onDone,
   view(){if(s.i>=items.length){const pc=pct(s.right,items.length),sec=Math.round((s.frozen=s.frozen||Date.now()-s.t0)/1000);
      return frame({title:l.measureName,sub:'Round complete',gl:l.g.measure,stage:`<div class="done-wm" lang="${l.bcp}">${l.g.measure}</div><div class="score"><span class="n num">${pc>=80?'🎉':pc>=50?'👍':'💪'} ${pc}%</span></div><p class="muted">${s.right} / ${items.length} ${l.unit} · ${sec}s</p><div class="wrap"><span class="tag ok">${zh?'ELO +5':'▲ +5 ELO'}</span>${zh?'<span class="tag brand">🎓 2 classifiers promoted!</span>':''}</div><p class="small muted">Rounds are 20 items in the app; this sample round is ${items.length}.</p>`,
        dock:`<div class="row"><button class="btn ghost" data-act="again">Next round</button><button class="btn" data-act="fin">Done</button></div>`})}
    const x=items[s.i],k=kind(),fbk=s.fb,rev=k==='Reverse';
    const prompt=rev?`<p class="eyebrow">Which noun takes ${tl(x[3])}?</p>`:zh?`<p class="prompt big" lang="zh-CN" style="font-size:40px">一 <u>${fbk?x[3]:'　'}</u> ${x[0]}</p><p class="center muted">yī ___ ${x[1]} · ${x[2]}</p>`:`<p class="prompt big" lang="ja" style="font-size:36px">${x[0]} を 一 <u>${fbk?x[3]:'　'}</u></p><p class="center muted">${x[1]?x[1]+' · ':''}${x[2]}</p>`;
    const body=k==='Type'?`<input type="text" data-bind="inp" data-enter="check" data-focus ${fbk?'disabled':''} value="${esc(s.inp)}" placeholder="${zh?'measure word':'counter'}" lang="${l.bcp}" aria-label="Your answer">${fbk?'':`<p class="hint">Press Enter to check</p><div>${fill}</div>`}`
      :`<div class="opts two">${s.opts.map((op,i)=>`<button class="opt ${!fbk?'':op.ok?'ok':i===s.sel?'no':''}" data-act="pick" data-v="${i}"><span class="k">${i+1}</span><span>${tl(op.t)}<small>${op.sub||''}</small></span></button>`).join('')}</div>`;
    const card=fbk&&(!zh||!fbk.ok)?`<div class="fb ${fbk.ok?'ok':'no'}"><b>${fbk.ok?'✓':'✕'} ${tl(zh?`一${x[3]}${x[0]}`:`${x[0]}を一${x[3]}`)}</b><span>${zh?x[4]:x[7]} · ${x[5]}</span>${fbk.ok?'':`<span>Your answer: ${tl(esc(fbk.given))}</span>`}${zh?'':`<span class="small"><b>Counting 1-10:</b> ${x[6]}</span>`}</div>`:'';
    return frame({title:l.measureName,sub:`${s.i+1} / ${items.length}${s.mode==='auto'?' · '+k:''}`,gl:l.g.measure,right:`<span class="num">${s.right} ✓</span>`,
      stage:`<div class="seg">${(zh?[['auto','Auto'],['choose','Choose'],['type','Type']]:[['choose','Choose'],['type','Type']]).map(([v,n])=>`<button class="${s.mode===v?'on':''}" data-act="dmode" data-v="${v}">${n}</button>`).join('')}</div>${prompt}${body}`,
      dock:card?card+'<button class="btn" data-act="next" data-focus>Continue</button>':k==='Type'&&!fbk?'<button class="btn" data-act="check">Check</button>':'<p class="hint">Tap an answer.</p>'})},
   acts:{dmode(v){s.mode=v;load();render()},
    pick(v){if(s.fb)return;s.sel=+v;answer(s.opts[+v].ok,s.opts[+v].t)},
    check(){const x=items[s.i],v=s.inp.trim();if(!v){toast('Type an answer first.');return}answer([x[3],x[4],x[7]].includes(v)||(!zh&&v===x[4].replace(/^ひ/,'ぴ')),v)},
    fill(){s.inp=items[s.i][3];render()},
    next(){s.i++;if(s.i<items.length)load();render()},
    again(){Object.assign(s,{i:0,right:0,t0:Date.now(),frozen:0});load();render()},fin(){close('done')}}};
  return me}

/* ---------- calibration ---------- */
function Calibration(){const l=L(),BANDS=['< 3.0','3.0–3.5','3.5–4.0','4.0–4.5','4.5–5.0','5.0–5.5','5.5+'];
  const s={mode:'meanings',n:0,ok:0,log:[],pool:[],cur:null,opts:[],pick:null,idk:false,res:false,loading:true};
  function nextWord(){if(!s.pool.length)s.pool=shuffle(Object.keys(l.words).filter(w=>s.mode==='meanings'||hasReading(w)));s.cur=s.pool.pop();s.pick=null;s.idk=false;
    const f=w=>s.mode==='meanings'?W(w).g:W(w).read,cands=Object.keys(l.words).filter(w=>w!==s.cur&&(s.mode==='meanings'||hasReading(w)));s.opts=shuffle([f(s.cur),...shuffle(cands).slice(0,3).map(f)])}
  const correct=()=>s.mode==='meanings'?W(s.cur).g:W(s.cur).read;
  function record(ok){s.n++;if(ok)s.ok++;s.log.push([W(s.cur).z,ok]);learn(s.cur,ok,s.idk)}
  setTimeout(()=>{s.loading=false;nextWord();if(P===me)render()},500);
  const me={s,
   view(){if(s.res){const few=s.n<8,est=(4.7-(s.ok/Math.max(1,s.n)-.5)*1.4).toFixed(2),pm=(1.1/Math.sqrt(Math.max(1,s.n))).toFixed(2);
      const bands=BANDS.map((b,i)=>{const lo=i===0?-9:2.5+i*.5,hi=i===6?99:3+i*.5,xs=s.log.filter(x=>x[0]>=lo&&x[0]<hi);return{b,n:xs.length,p:pct(xs.filter(x=>x[1]).length,xs.length)}});
      return frame({title:'Calibration',sub:'Your result',gl:l.g.cal,stage:`<div class="score"><span class="n num" style="font-size:44px">${few?pct(s.ok,s.n)+'%':est+' ± '+pm}</span></div>
        <p class="muted">${few?'Answer more words to get a frequency level — right now this is just your score so far.':'Your vocabulary reaches down to this word-frequency level (Zipf). Lower is a larger vocabulary.'}</p>
        <div class="card"><div class="bars num">${bands.map(x=>`<div><span>${x.n?x.p+'%':''}</span><i style="height:${x.n?Math.max(4,x.p*.6):2}%;${x.n?'':'background:var(--line)'}"></i><span>${x.b}<br>n=${x.n}</span></div>`).join('')}</div><p class="small muted" style="margin-top:8px">Share of words you knew in each frequency band. Rarer words are on the left.${s.n<20?' This is based on only a few answers, so treat it as a rough guide.':''}</p></div>
        <div class="note"><b>Test difficulty</b><br>${s.n>=20?'Reading: adjusted 1200 → 1250':'Reading: unchanged — answer at least 20 words first'}</div>`,
        dock:`<div class="row"><button class="btn ghost" data-act="restart">Start again</button><button class="btn" data-act="x">Back home</button></div>`})}
    const done=s.pick!=null||s.idk,c=s.cur?correct():'';
    return frame({title:'Calibration',sub:`${s.n} answered · ${pct(s.ok,s.n)}% correct`,gl:l.g.cal,right:'<button class="btn sm ghost" data-act="finish">Finish</button>',
      stage:`<div class="seg"><button class="${s.mode==='meanings'?'on':''}" data-act="cmode" data-v="meanings">Meanings</button><button class="${s.mode==='readings'?'on':''}" data-act="cmode" data-v="readings">Readings</button></div>
        ${s.loading?'<p class="note center" style="margin-top:40px">Preparing your calibration…</p>':`<p class="prompt big" lang="${l.bcp}">${s.cur}</p>${s.mode==='meanings'?`<p class="center muted">${W(s.cur).read}</p>`:''}<p class="eyebrow">${s.mode==='meanings'?'Which definition is correct?':'Which reading is correct?'}</p>
        <div class="opts">${s.opts.map((t,i)=>`<button class="opt ${!done?'':t===c?'ok':i===s.pick?'no':''}" data-act="pick" data-v="${i}"><span class="k">${i+1}</span><span>${t}</span></button>`).join('')}</div>`}`,
      dock:s.loading?'':done?'<button class="btn" data-act="next" data-focus>Next word</button>':'<button class="btn ghost" data-act="idk">I don’t know</button>'})},
   acts:{cmode(v){Object.assign(s,{mode:v,n:0,ok:0,log:[],pool:[]});nextWord();render()},
    pick(v){if(s.pick!=null||s.idk)return;s.pick=+v;const ok=s.opts[s.pick]===correct();record(ok);render();if(ok){const w=s.cur;setTimeout(()=>{if(P===me&&s.cur===w&&!s.res)me.acts.next()},450)}},
    idk(){s.idk=true;record(false);render()},next(){nextWord();render()},finish(){s.res=true;render()},
    restart(){Object.assign(s,{n:0,ok:0,log:[],pool:[],res:false});nextWord();render()}}};
  return me}
