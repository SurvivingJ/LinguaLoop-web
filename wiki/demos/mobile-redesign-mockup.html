<title>LinguaDojo Mobile Redesign</title>

<style>

   One task per screen, answer controls in the thumb zone, bottom tabs instead of a hamburger. */
:root{
  --bg:#edf3f1; --surface:#fff; --surface-2:#e1ebe8; --ink:#0b2326; --ink-2:#48605f; --line:#d2dfdb;
  --brand:#0a6b60; --brand-ink:#fff; --brand-wash:#d4ebe5;
  --glow:#ef6a35; --glow-text:#ad4212; --glow-wash:#fde5d9;
  --good:#1c7648; --good-wash:#d9f0e2; --bad:#b93a30; --bad-wash:#f8e1de; --warn:#8a5d00; --warn-wash:#f8ecc9; --info:#2b5f9e; --info-wash:#dfe9f6;
  --t1:#c2362c; --t2:#c46a0a; --t3:#1c7648; --t4:#2b5f9e; --t5:#6a7f80;
  --hero-a:#07312f; --hero-b:#0b6157; --hero-ink:#eaf8f4; --hero-dim:#a9d3ca;
  --shadow:0 10px 30px rgb(11 35 38 / 10%);
  --f-display:"Bricolage Grotesque","Instrument Sans",system-ui,sans-serif;
  --f-body:"Instrument Sans",system-ui,-apple-system,"PingFang SC","Hiragino Sans",sans-serif;
  --f-cjk:"Noto Serif SC","Songti SC","STSong",serif;
}

  --bg:#061416; --surface:#0d2023; --surface-2:#152e2e; --ink:#e6f2ef; --ink-2:#94aeaa; --line:#1f3a3a;
  --brand:#38c7b1; --brand-ink:#04211e; --brand-wash:#113835;
  --glow:#ff8a57; --glow-text:#ffa77e; --glow-wash:#3a2015;
  --good:#52cd8f; --good-wash:#103224; --bad:#ff8175; --bad-wash:#3b1b18; --warn:#e9be55; --warn-wash:#33290f; --info:#7fb2ee; --info-wash:#13273f;
  --t1:#ff8175; --t2:#f0a04b; --t3:#52cd8f; --t4:#7fb2ee; --t5:#94aeaa;
  --hero-a:#0b3a37; --hero-b:#0f6a5f; --hero-ink:#eaf8f4; --hero-dim:#a9d3ca;
  --shadow:0 10px 30px rgb(0 0 0 / 40%); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#061416; --surface:#0d2023; --surface-2:#152e2e; --ink:#e6f2ef; --ink-2:#94aeaa; --line:#1f3a3a;
  --brand:#38c7b1; --brand-ink:#04211e; --brand-wash:#113835;
  --glow:#ff8a57; --glow-text:#ffa77e; --glow-wash:#3a2015;

  --t1:#ff8175; --t2:#f0a04b; --t3:#52cd8f; --t4:#7fb2ee; --t5:#94aeaa;
  --hero-a:#0b3a37; --hero-b:#0f6a5f; --hero-ink:#eaf8f4; --hero-dim:#a9d3ca;
  --shadow:0 10px 30px rgb(0 0 0 / 40%); color-scheme:dark}

/* The app's existing named themes, selectable in Me → Colour theme. Values come from static/css/styles.css. */
:root[data-palette="stillwater"]{--bg:#f6f9f8; --surface:#fff; --surface-2:#eaf1ef; --ink:#13282b; --ink-2:#51686a; --line:#dde7e5; --brand:#0e7569; --brand-ink:#fff; --brand-wash:#ddeeea;
  --glow:#e8833a; --glow-text:#a35417; --glow-wash:#fbe9da; --hero-a:#0a574e; --hero-b:#0e7569; --hero-dim:#b9ddd6; --good:#2e7d4f; --good-wash:#ddefe4; --bad:#c24a3f; --bad-wash:#f6e2df; --warn:#7d5a10; --warn-wash:#f7ecd6; --info:#3b6ea8; --info-wash:#e1eaf5;
  --t1:#c2362c; --t2:#c46a0a; --t3:#1c7648; --t4:#2b5f9e; --t5:#6a7f80; --hero-ink:#fff; --shadow:0 10px 30px rgb(19 40 43 / 10%); color-scheme:light}
:root[data-palette="sakura"]{--bg:#fbf3f6; --surface:#fff; --surface-2:#f8e6ee; --ink:#2a1620; --ink-2:#7a5566; --line:#f0d5e0; --brand:#c0407c; --brand-ink:#fff; --brand-wash:#f8e6ee;
  --glow:#e8833a; --glow-text:#a35417; --glow-wash:#fbe9da; --hero-a:#6e1f45; --hero-b:#c0407c; --hero-dim:#f3c9dc; --good:#2e7d4f; --good-wash:#ddefe4; --bad:#c24a3f; --bad-wash:#f6e2df; --warn:#7d5a10; --warn-wash:#f7ecd6; --info:#3b6ea8; --info-wash:#e1eaf5;
  --t1:#c2362c; --t2:#c46a0a; --t3:#1c7648; --t4:#2b5f9e; --t5:#6a7f80; --hero-ink:#fff; --shadow:0 10px 30px rgb(19 40 43 / 10%); color-scheme:light}
:root[data-palette="forest"]{--bg:#f4f8f4; --surface:#fdfefd; --surface-2:#e6eee6; --ink:#14241a; --ink-2:#566b5c; --line:#cfdccf; --brand:#2f7d46; --brand-ink:#fff; --brand-wash:#e1efe3;
  --glow:#b08530; --glow-text:#7a5a17; --glow-wash:#f3e9cf; --hero-a:#17402a; --hero-b:#2f7d46; --hero-dim:#c3dcc8; --good:#2e7d4f; --good-wash:#ddefe4; --bad:#c24a3f; --bad-wash:#f6e2df; --warn:#7d5a10; --warn-wash:#f7ecd6; --info:#3b6ea8; --info-wash:#e1eaf5;
  --t1:#c2362c; --t2:#c46a0a; --t3:#1c7648; --t4:#2b5f9e; --t5:#6a7f80; --hero-ink:#fff; --shadow:0 10px 30px rgb(19 40 43 / 10%); color-scheme:light}
:root[data-palette="inkstone"]{--bg:#f5f1e8; --surface:#fff; --surface-2:#ece6d6; --ink:#0e1116; --ink-2:#4a4843; --line:#d9d2c2; --brand:#b5331e; --brand-ink:#fff; --brand-wash:#f4dcd4;
  --glow:#b8862c; --glow-text:#6f5212; --glow-wash:#f2e5cc; --hero-a:#0e1116; --hero-b:#4a2a22; --hero-dim:#cfc6b3;
  --good:#4a6b3a; --good-wash:#e2ead9; --bad:#7a2222; --bad-wash:#ead4d4; --warn:#6f5212; --warn-wash:#f2e5cc; --info:#2d4a6b; --info-wash:#dae0e9;
  --t1:#b5331e; --t2:#b8862c; --t3:#4a6b3a; --t4:#2d4a6b; --t5:#6b695f; --hero-ink:#fff; --shadow:0 10px 30px rgb(14 17 22 / 12%); color-scheme:light}
:root[data-palette="midnight"]{--bg:#0b1416; --surface:#122021; --surface-2:#18292a; --ink:#eef4f3; --ink-2:#a8bcb9; --line:#1f3335; --brand:#3db3a0; --brand-ink:#06201c; --brand-wash:#143432;
  --glow:#f0975a; --glow-text:#f0975a; --glow-wash:#3a2616; --hero-a:#10302e; --hero-b:#1c5a52; --hero-dim:#a9d3ca; --hero-ink:#eef4f3;
  --good:#57a877; --good-wash:#17302a; --bad:#e0796f; --bad-wash:#3a2423; --warn:#dcae54; --warn-wash:#34301f; --info:#7aa3d6; --info-wash:#1b2c3d;
  --t1:#e0796f; --t2:#f0975a; --t3:#57a877; --t4:#7aa3d6; --t5:#93a6a4; --shadow:0 10px 30px rgb(0 0 0 / 45%); color-scheme:dark}
.sws{display:flex;flex:none} .sws i{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);margin-left:-6px} .sws i:first-child{margin-left:0}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.45 var(--f-body);overflow:hidden;
  display:flex;justify-content:center;align-items:center;gap:48px;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,textarea:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
h1,h2,h3,p{margin:0}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
[data-lang="ja"]{--f-cjk:"Noto Serif JP","Hiragino Mincho ProN","Yu Mincho",serif}
.tl{font-family:var(--f-cjk);font-weight:500}

/* shell */
.app{position:relative;width:100%;height:var(--vvh,100%);display:flex;flex-direction:column;background:var(--bg);overflow:hidden}
#view{flex:1;min-height:0;display:flex;flex-direction:column}
.stage{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding-block:6px 14px;overscroll-behavior:contain}
.stage>*{flex:none}
.dock{flex:none;display:flex;flex-direction:column;gap:8px;padding-block:10px 12px;background:var(--bg);border-top:1px solid var(--line)}
.row{display:flex;gap:8px;align-items:center}
.between{justify-content:space-between}
.col{display:flex;flex-direction:column;gap:8px}
.grow{flex:1;min-width:0}
aside{display:none}
@media (min-width:760px){
  body{padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .app{width:var(--dw,393px);height:min(var(--dh,659px),100%);flex:none;border-radius:34px;border:1px solid var(--line);box-shadow:var(--shadow)}
  aside{display:flex;flex-direction:column;gap:18px;width:320px;max-height:100%;overflow-y:auto}
}
#tabs{flex:none;display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-top:1px solid var(--line);padding-block:6px}
#tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--ink-2);padding:4px 0;min-height:46px}
#tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#tabs button.on{color:var(--brand)}

/* type */
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2)}
.h1{font:700 26px/1.1 var(--f-display);letter-spacing:-.02em;text-wrap:balance}
.h2{font:700 18px/1.2 var(--f-display);letter-spacing:-.01em}
.muted{color:var(--ink-2)} .small{font-size:12.5px} .center{text-align:center}
.num{font-variant-numeric:tabular-nums}

/* controls */
.btn{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 16px;border-radius:16px;background:var(--brand);color:var(--brand-ink);font-weight:700;font-size:16px;transition:transform .12s;text-align:center}
.btn:active{transform:scale(.98)}
.btn[disabled]{background:var(--surface-2);color:var(--ink-2);cursor:default}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.ok{background:var(--good);color:var(--surface)}
.btn.sm{min-height:40px;font-size:14px;flex:none;border-radius:13px}
.btn.icon{flex:none;width:50px;padding:0}
.link{font-size:13px;font-weight:700;color:var(--brand);padding:6px 0}
.link.quiet{color:var(--ink-2)}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:0 12px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-size:12.5px;font-weight:600;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}
.chips::-webkit-scrollbar{display:none}
.wrap{display:flex;flex-wrap:wrap;gap:6px}
.seal{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:9px;background:var(--brand-wash);color:var(--brand);font:700 16px/1 var(--f-cjk);flex:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.tag.due,.tag.warn{background:var(--warn-wash);color:var(--warn)} .tag.ok{background:var(--good-wash);color:var(--good)}
.tag.bad{background:var(--bad-wash);color:var(--bad)} .tag.info{background:var(--info-wash);color:var(--info)} .tag.brand{background:var(--brand-wash);color:var(--brand)}
.note{padding:10px 12px;border-radius:14px;font-size:13.5px;background:var(--info-wash);color:var(--ink)}
.note.warn{background:var(--warn-wash)} .note.ok{background:var(--good-wash)} .note.bad{background:var(--bad-wash)}
.seg{display:flex;background:var(--surface-2);border-radius:11px;padding:3px}
.seg button{flex:1;padding:6px 10px;border-radius:9px;font-size:12.5px;font-weight:700;color:var(--ink-2);white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--ink)}
.seg button[disabled]{opacity:.4}
.sw{width:44px;height:26px;border-radius:99px;background:var(--surface-2);position:relative;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgb(0 0 0 / 25%);transition:transform .15s}
.sw.on{background:var(--brand)} .sw.on::after{transform:translateX(18px)}
textarea,input[type=email],input[type=text],input[type=number],select{width:100%;font:500 18px/1.5 var(--f-cjk);color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;resize:none}
input[type=email],input[type=text],input[type=number],select{font:500 16px/1.4 var(--f-body);min-height:48px}
input.okv{border-color:var(--good)} input.badv{border-color:var(--bad)} input.idkv{border-color:var(--warn)}
input[type=range]{width:100%;accent-color:var(--brand)}

/* top bars */
.top{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;padding-block:10px 6px}
.langbtn{display:flex;align-items:center;gap:8px;font-weight:700}
.langbtn .seal{background:var(--ink);color:var(--bg)}
.ib{width:38px;height:38px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-size:16px;flex:none}
.rhead{flex:none;display:flex;align-items:center;gap:10px;padding-block:8px 4px;min-height:50px}
.rhead .back{display:flex;align-items:center;gap:4px;height:42px;padding:0 14px 0 9px;border-radius:99px;background:var(--surface);border:1.5px solid var(--ink);font-weight:700;font-size:14.5px;flex:none}
.rhead .back i{font:400 26px/1 var(--f-body);font-style:normal;margin-top:-3px}
.stage>.swipe{flex:1;display:flex;flex-direction:column;gap:12px;touch-action:none;user-select:none;-webkit-user-select:none}
.btn.back2{flex:none;min-height:44px}
.rhead .rt{flex:1;min-width:0;display:flex;align-items:center;gap:8px}
.rhead .rt b{display:block;font-size:14.5px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rhead .rt small{display:block;font-size:11.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rhead .rr{flex:none;font-size:12.5px;font-weight:700;color:var(--ink-2);text-align:right}
.strip{flex:none;display:flex;align-items:center;gap:8px;padding-block:2px 4px;font-size:11.5px;font-weight:700;color:var(--ink-2)}
.dots{flex:1;display:flex;gap:4px}
.dots i{flex:1;height:5px;border-radius:9px;background:var(--surface-2)}
.dots i.d{background:var(--good)} .dots i.c{background:var(--brand);box-shadow:0 0 0 2px var(--brand-wash)} .dots i.s{background:var(--warn);opacity:.5}
.bar{height:6px;border-radius:9px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand);border-radius:9px}
.pips{display:flex;gap:3px;flex-wrap:wrap}
.pips i{width:14px;height:5px;border-radius:9px;background:var(--surface-2)}
.pips i.c{background:var(--good)} .pips i.w{background:var(--bad)} .pips i.cur{background:var(--brand)}

/* hero + lists */
.hero{position:relative;overflow:hidden;border-radius:24px;padding:16px;color:var(--hero-ink);background:linear-gradient(150deg,var(--hero-a),var(--hero-b));display:flex;flex-direction:column;gap:12px}
.hero .wm{position:absolute;right:-14px;top:-34px;font:700 150px/1 var(--f-cjk);opacity:.1;pointer-events:none;white-space:nowrap}
.hero .eyebrow,.hero .sub{color:var(--hero-dim)}
.hero .sub{font-size:13px}
.items{display:flex;gap:6px;position:relative;flex-wrap:wrap}
.items .seal{width:36px;height:36px;border-radius:11px;font-size:18px;background:rgb(255 255 255 / 12%);color:var(--hero-ink)}
.items .seal.done{background:var(--hero-ink);color:var(--hero-a)}
.items .seal.now{box-shadow:0 0 0 2px var(--glow)}
.hero .btn{background:var(--glow);color:#1c0a02;flex:none}
.hero .link{color:var(--hero-ink);align-self:center;padding:0}
.week{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--hero-dim)}
.week .bar{flex:1;background:rgb(255 255 255 / 14%)} .week .bar i{background:var(--hero-ink)}
.sech{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.hrow{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px;scroll-snap-type:x proximity}
.hrow::-webkit-scrollbar{display:none}
.hrow>*{flex:none;scroll-snap-align:start}
.pick{width:230px;text-align:left;display:flex;flex-direction:column;gap:5px}
.pick .tl{font-size:18px;line-height:1.25}
.meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--ink-2);font-weight:600}
.meta b{color:var(--brand)}
.rowlist{display:flex;flex-direction:column;gap:8px}
.trow{display:flex;align-items:center;gap:12px;text-align:left;width:100%;padding:11px 13px;border-radius:18px;background:var(--surface);border:1px solid var(--line)}
.trow .gl{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:var(--brand-wash);color:var(--brand);font:700 21px/1 var(--f-cjk);flex:none}
.trow .mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.trow .mid .tl{font-size:17px;line-height:1.25}
.trow .mid small{color:var(--ink-2);font-size:12.5px}
.trow .end{font-size:12px;font-weight:700;color:var(--ink-2);text-align:right;white-space:nowrap}
.trow.faded{opacity:.55} .trow.faded b{text-decoration:line-through}
.set{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-top:1px solid var(--line);min-height:52px;width:100%;text-align:left}
.set:first-child{border-top:0}
.set small{display:block;color:var(--ink-2);font-size:12.5px}
.step{display:flex;align-items:center;gap:10px;font-weight:700}
.step button{width:34px;height:34px;border-radius:50%;background:var(--surface-2);font-size:17px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats.two{grid-template-columns:1fr 1fr} .stats.four{grid-template-columns:repeat(4,1fr)}
.stat{padding:10px;border-radius:16px;background:var(--surface);border:1px solid var(--line);min-width:0}
.stat .n{font:700 22px/1.1 var(--f-display)}
.stat small{display:block;font-size:11px;color:var(--ink-2);font-weight:600}
.bars{display:flex;align-items:flex-end;gap:6px;height:96px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;height:100%;font-size:10px;color:var(--ink-2);font-weight:600;text-align:center}
.bars i{width:100%;border-radius:6px 6px 2px 2px;background:var(--brand);min-height:2px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);padding:6px 6px 6px 0}
.tbl td{padding:8px 6px 8px 0;border-top:1px solid var(--line);vertical-align:top}
.scroll-x{overflow-x:auto}

/* exercises + tests */
.qtext{font:500 21px/1.4 var(--f-cjk);text-wrap:pretty}
.prompt{font:500 23px/1.55 var(--f-cjk);text-wrap:pretty}
.prompt.big{font-size:46px;line-height:1.15;text-align:center;padding-block:4px}
.prompt u,.blank{display:inline-block;min-width:2.3em;text-align:center;text-decoration:none;border-bottom:2.5px solid var(--glow);line-height:1.2}
.prompt u.fill{color:var(--brand);border-color:var(--brand)}
.opts{display:flex;flex-direction:column;gap:7px}
.opts.two{display:grid;grid-template-columns:1fr 1fr}

const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tl=(t,cls='')=>`<span class="tl ${cls}" lang="${L().bcp}">${t}</span>`;
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pct=(a,b)=>b?Math.round(a/b*100):0;
const mmss=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');

/* ---------- words, readings, knowledge ---------- */
const TM={a:'āáǎà',e:'ēéěè',i:'īíǐì',o:'ōóǒò',u:'ūúǔù'};
function tone(s,t){if(t===5||!t)return s;let i=s.search(/[ae]/);if(i<0)i=s.indexOf('ou');if(i<0)for(let j=s.length-1;j>=0;j--)if(TM[s[j]]){i=j;break}return s.slice(0,i)+TM[s[i]][t-1]+s.slice(i+1)}
const pyParts=n=>n.split(' ').map(x=>({s:x.slice(0,-1),t:+x.slice(-1)}));
const KR={};'あa いi うu えe おo かka きki くku けke こko さsa しshi すsu せse そso たta ちchi つtsu てte とto なna にni ぬnu ねne のno はha ひhi ふfu へhe ほho まma みmi むmu めme もmo やya ゆyu よyo らra りri るru れre ろro わwa をo んn がga ぎgi ぐgu げge ごgo ざza じji ずzu ぜze ぞzo だda ぢji づzu でde どdo ばba びbi ぶbu べbe ぼbo ぱpa ぴpi ぷpu ぺpe ぽpo'.split(' ').forEach(x=>KR[x[0]]=x.slice(1));
function romaji(k){let o='';for(let i=0;i<k.length;i++){const c=k[i],n=k[i+1];
  if(c==='っ'){o+=(KR[n]||'')[0]||'';continue}
  if(n&&'ゃゅょ'.includes(n)){const b=KR[c]||'',v={'ゃ':'a','ゅ':'u','ょ':'o'}[n];o+=(/^(sh|ch|j)/.test(b)?b.slice(0,-1):b.slice(0,-1)+'y')+v;i++;continue}
  o+=KR[c]||c}return o}
const normR=r=>r.toLowerCase().replace(/ō/g,'o').replace(/ū/g,'u').replace(/[^a-z]/g,'').replace(/si/g,'shi').replace(/ti/g,'chi').replace(/tu/g,'tsu').replace(/hu/g,'fu').replace(/zi/g,'ji').replace(/sy/g,'sh').replace(/ty/g,'ch').replace(/zy/g,'j').replace(/ou|oo/g,'o').replace(/uu/g,'u');
const kataToHira=s=>s.replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60));
function W(lemma){const w=L().words[lemma];if(!w)return null;const zh=S.lang==='zh';
  return{lemma,raw:w[0],pos:w[1],g:w[2],ex:w[3],z:w[5],read:zh?pyParts(w[0]).map(p=>tone(p.s,p.t)).join(''):w[0],
    full:zh?pyParts(w[0]).map(p=>tone(p.s,p.t)).join('')+' ('+w[0]+')':w[0]?w[0]+' · '+romaji(w[0]):''}}
const hasReading=lemma=>!!L().words[lemma][0];
const pNow=lemma=>S.know[S.lang][lemma]??L().words[lemma][4];
const status=p=>p<.2?'unknown':p<.5?'encountered':p<.75?'learning':p<.9?'probably_known':'known';
const STATUS={unknown:['New','bad'],encountered:['Seen before','warn'],learning:['Learning','brand'],probably_known:['Probably known','ok'],known:['Known','ok']};
function learn(lemma,ok,idk){const p=pNow(lemma);S.know[S.lang][lemma]=idk?p*.5:ok?p+(1-p)*.22:p*.7}
function gradeZh(inp,num,tones){const ps=pyParts(num),u=inp.toLowerCase().replace(/[\s'’]/g,''),plain=ps.map(p=>p.s).join('');
  if(tones){const ok=ps.every((p,i)=>tones[i]===p.t);return{ok,detail:ok?'':'Syllables right, tones wrong.'}}
  if(/\d/.test(u)){const m=u.match(/[a-z]+\d?/g)||[];if(m.map(x=>x.replace(/\d/,'')).join('')!==plain)return{ok:false,detail:'The syllables are not right.'};
    const ok=m.length===ps.length&&m.every((x,i)=>(+(x.match(/\d/)||[5])[0]||5)===ps[i].t);return{ok,detail:ok?'':'Syllables right, tones wrong.'}}
  if(u===plain)return{need:1};
  if(u===ps.map(p=>tone(p.s,p.t)).join(''))return{ok:true};
  if(u.normalize('NFD').replace(/[̀-ͯ]/g,'')===plain)return{ok:false,detail:'Syllables right, tones wrong.'};
  return{ok:false,detail:'The syllables are not right.'}}
function gradeJa(inp,kana){const u=inp.trim();if(kataToHira(u)===kana)return{ok:true};
  if(/^[a-zāīūēō\s'-]+$/i.test(u)&&normR(u)===normR(romaji(kana)))return{ok:true,detail:'Romaji accepted.'};return{ok:false}}

/* ---------- tests ---------- */
const toks=t=>t.segs.map(s=>typeof s==='string'?{s}:{s:s[0],r:S.lang==='zh'?(W(s[0])||{}).read:s[1],lemma:L().words[s[2]||s[0]]?(s[2]||s[0]):null});
const text=t=>t.segs.map(s=>typeof s==='string'?s:s[0]).join('');
const sentences=t=>text(t).split(/(?<=。)/).filter(Boolean);
const linked=t=>[...new Set(toks(t).filter(x=>x.lemma).map(x=>x.lemma))];
const inQ=(t,lemma)=>t.qs.some(q=>q.w.includes(lemma));
function analyse(t,added=new Set()){const all=linked(t),study=all.filter(w=>pNow(w)<.75||added.has(w));
  const share=all.filter(w=>pNow(w)<.75).length/all.length;
  return{all,study,share,unknown:all.filter(w=>pNow(w)<.5).length,mode:share>.25?'full':share>=.05?'light':'none'}}
const surfaceOf=(t,lemma)=>(toks(t).find(x=>x.lemma===lemma)||{}).s||lemma;
function sentenceFor(lemma,t){const tt=t?[t]:L().tests.filter(x=>x.segs);for(const x of tt){const sf=surfaceOf(x,lemma),s=sentences(x).find(y=>y.includes(sf));if(s&&linked(x).includes(lemma))return{s,sf}}
  const ex=L().words[lemma][3];return ex.includes(lemma)?{s:ex,sf:lemma}:null}
function passageHTML(t,{aids='off',hl=false,tap=false,added=new Set()}={}){
  return `<p class="passage ${aids!=='off'?'aids':''} ${hl?'hl':''} ${tap?'tap':''}" lang="${L().bcp}">${toks(t).map(x=>{
    if(!x.lemma&&!x.r)return x.s;const p=x.lemma?pNow(x.lemma):1,show=x.r&&(aids==='all'||(aids==='unknown'&&x.lemma&&p<.5));
    const inner=show?`<ruby>${x.s}<rt>${x.r}</rt></ruby>`:x.s;
    return x.lemma?`<span class="lk ${status(p)} ${added.has(x.lemma)?'added':''}" ${tap?`data-act="word" data-v="${x.lemma}"`:''}>${inner}</span>`:inner}).join('')}</p>`}

/* ---------- ui helpers ---------- */
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2600)}
function sheet(html,owner){$('#sheetc').innerHTML=html;$('#sheet').hidden=false;sheetOwner=owner||null}
function closeSheet(){$('#sheet').hidden=true;sheetOwner=null}
function stopSpeech(){try{speechSynthesis.cancel()}catch(e){}clearTimeout(speakT);S.playing=0;syncAudio()}
function syncAudio(){document.querySelectorAll('.audio').forEach(a=>{a.classList.toggle('playing',!!S.playing);a.querySelector('.play').textContent=S.playing?'❚❚':'▶'})}
function speak(t,rate=1){if(S.playing){stopSpeech();return}
  S.playing=1;syncAudio();const end=()=>{clearTimeout(speakT);S.playing=0;syncAudio()};
  speakT=setTimeout(end,Math.max(2500,t.length*300/rate));
  try{const u=new SpeechSynthesisUtterance(t);u.lang=L().bcp;u.rate=rate*.9;u.onend=end;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){toast('No speech voice here, so playback is simulated.')}}
const wave=()=>Array.from({length:26},(_,i)=>`<i style="--h:${28+Math.round(Math.abs(Math.sin(i*1.7)+Math.sin(i*.6))*34)}"></i>`).join('');
const audio=(speed,extra='')=>`<div class="audio ${S.playing?'playing':''}"><button class="play" data-act="play" aria-label="Play or pause audio">${S.playing?'❚❚':'▶'}</button><div class="wave">${wave()}</div>${extra}<button class="chip num" data-act="speed" aria-label="Playback speed">${speed.toFixed(2).replace(/0$/,'')}x</button></div>`;
const opts=(o,cls,{plain,subs,act='pick'}={})=>`<div class="opts">${o.map((t,i)=>`<button class="opt ${cls(i)}" data-act="${act}" data-v="${i}"><span class="k">${'ABCD'[i]}</span><span>${plain?esc(t):tl(t)}${subs?`<small>${subs[i]}</small>`:''}</span></button>`).join('')}</div>`;
const fill=`<button class="chip" data-act="fill" title="Mockup helper">Fill answer</button>`;
function sessionStrip(){if(!RUN||RUN.over||RUN.mode!=='daily')return'';
  return `<div class="strip pad"><span>Daily Session</span><div class="dots">${RUN.items.map((it,j)=>`<i class="${S.done[S.lang][it.key]||RUN.stat[j]==='done'?'d':RUN.stat[j]==='skip'?'s':j===RUN.i?'c':''}" title="${it.type}"></i>`).join('')}</div><span class="num">${RUN.items.filter(it=>S.done[S.lang][it.key]).length}/${RUN.items.length}</span>${P&&P.skippable?'<button class="link quiet" data-act="skipItem" style="padding:0">Skip for now</button>':''}</div>`}
function frame({title,sub='',gl='',right='',stage,dock=''}){
  return `<header class="rhead pad"><button class="back" data-act="x" aria-label="Back"><i>‹</i>Back</button><div class="rt">${gl?`<span class="seal" lang="${L().bcp}">${gl}</span>`:''}<div class="grow"><b>${title}</b>${sub?`<small>${sub}</small>`:''}</div></div><div class="rr num">${right}</div></header>${sessionStrip()}<div class="stage pad">${stage}</div>${dock?`<div class="dock pad">${dock}</div>`:''}`}
function levels(type,n){const a=[];for(let i=0;i<=n;i++)a.push(type==='heiban'?+(i>0):type==='atama'?+(i===0):type==='naka'?+(i===1):+(i>0&&i<n));return a}
function contour(lv,kana){const n=kana.length,xs=lv.map((_,i)=>16+i*(108/n)),ys=lv.map(h=>h?12:32);
  return `<svg viewBox="0 0 140 58" aria-hidden="true"><polyline class="ln" points="${xs.map((x,i)=>x+','+ys[i]).join(' ')}"/>${xs.map((x,i)=>`<circle class="${i===n?'p':''}" cx="${x}" cy="${ys[i]}" r="4"/><text x="${x}" y="54">${i===n?'が':kana[i]}</text>`).join('')}</svg>`}

/* ---------- player stack + session runner ---------- */
function open(p){if(P)stack.push(P);P=p;stopSpeech();closeSheet();render()}
function close(result){const p=P;stopSpeech();closeSheet();if(p&&p.cleanup)p.cleanup();P=stack.pop()||null;if(p&&p.onDone)p.onDone(result);render()}
function unwind(){stopSpeech();closeSheet();[P,...stack].forEach(p=>p&&p.cleanup&&p.cleanup());stack.length=0;P=null}
function sessionItems(){const l=L(),t=l.tests,m=S.plan.mods,on=k=>m[k]!==false,both=S.plan.cover==='both';
  return[
   on('listening')&&{key:'listen',type:'Listening',gl:l.g.listen,title:t[0].title,tlx:1,min:6,start:d=>openTest(t[0],'listen',{daily:1,onDone:d})},
   both&&on('vocab')&&{key:'practice',type:'Practice',gl:l.g.practice,title:'Vocabulary practice',min:8,start:d=>open(Practice({drill:l.newWords,onDone:d}))},
   on('reading')&&{key:'read',type:'Reading',gl:l.g.read,title:t[1].title,tlx:1,min:11,hard:1,start:d=>hardTest(t[1],'read',d)},
   on('dictation')&&{key:'dict',type:'Dictation',gl:l.g.dict,title:t[0].title,tlx:1,min:4,start:d=>open(Dictation(t[0],{daily:1,onDone:d}))},
   both&&on('flashcards')&&{key:'cards',type:'Flashcards',gl:l.g.cards,title:'6 cards due',min:2,start:d=>open(Flashcards({onDone:d}))},
   both&&on('dt')&&{key:'dt',type:'Dual Translation',gl:l.g.dt,title:'Translate a short passage',min:5,start:d=>open(DT({onDone:d}))}].filter(Boolean)}
function hardTest(t,type,d){const go=()=>open(Prestudy(t,type,{trigger:'auto',daily:1,onDone:d}));
  if(S.plan.prestudy==='off'){openTest(t,type,{daily:1,onDone:d});return}
  if(S.plan.prestudy==='auto'){go();return}
  open({onDone:d,skippable:0,view:()=>frame({title:tl(t.title),sub:'Reading · New',gl:L().g.read,stage:`<div class="done-wm" lang="${L().bcp}">${L().g.study}</div><p class="eyebrow">This one is a stretch</p><h1 class="h1">${pct(analyse(t).study.length,analyse(t).all.length)}% of its key words are new to you</h1><p class="muted">Study first (about 6 min), then take it. Your first attempt after studying counts at half weight for your rating.</p>`,
    dock:`<button class="btn" data-act="hs">Study first, then take it</button><button class="btn ghost" data-act="hc">Take it now</button>`}),
    acts:{hs(){const cb=P.onDone;P.onDone=null;close();go()},hc(){const cb=P.onDone;P.onDone=null;close();openTest(t,type,{daily:1,onDone:cb})}}})}
function startSession(){const items=sessionItems(),d=S.done[S.lang];if(!items.length){toast('No session items for today. Check your Study Plan.');return}
  RUN={mode:'daily',items,i:Math.max(0,items.findIndex(it=>!d[it.key])),stat:{}};runItem()}
function runItem(){const it=RUN.items[RUN.i];RUN.cb=r=>{RUN.stat[RUN.i]=r==='skip'?'skip':'done';if(r!=='skip')S.done[S.lang][it.key]=1;
    const nx=RUN.items.findIndex((x,j)=>j>RUN.i&&!S.done[S.lang][x.key]&&!RUN.stat[j]);
    if(nx<0){RUN.over=true;RUN.tail=true;unwind();S.screen='summary'}else{RUN.i=nx;runItem()}};
  it.start(RUN.cb)}

/* ---------- render + events ---------- */
function render(){const app=$('#app');app.dataset.lang=S.lang;
  const keep=$('.stage')&&P&&P.keepScroll?$('.stage').scrollTop:0;
  $('#view').innerHTML=P?P.view():screens[S.screen]();
  $('#tabs').hidden=!!P||!['today','practice','tests','me'].includes(S.screen);
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.v===S.screen));
  const st=$('.stage');if(st)st.scrollTop=keep;
  const af=$('[data-focus]');if(af&&window.matchMedia('(min-width:760px)').matches)af.focus()}
function act(name,v,el){const f=(sheetOwner&&sheetOwner[name])||(P&&P.acts&&P.acts[name])||A[name];if(f)f(v,el)}
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t||t.disabled)return;act(t.dataset.act,t.dataset.v,t)});
document.addEventListener('input',e=>{const k=e.target.dataset.bind;if(!k)return;const tgt=P&&P.s?P.s:S;tgt[k]=e.target.value;if(P&&P.onInput)P.onInput(k,e.target)});
document.addEventListener('change',e=>{const k=e.target.dataset.change;if(k)act(k,e.target.value,e.target)});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing&&e.target.dataset&&e.target.dataset.enter){e.preventDefault();act(e.target.dataset.enter)}});
if(window.visualViewport)visualViewport.addEventListener('resize',()=>{const k=window.innerHeight-visualViewport.height>120;$('#app').style.setProperty('--vvh',k?visualViewport.height+'px':'100%')});
let sw=null;
document.addEventListener('pointerdown',e=>{sw=P&&P.swipe&&e.target.closest('.swipe')?[e.clientX,e.clientY]:null});
document.addEventListener('pointerup',e=>{if(!sw)return;const dx=e.clientX-sw[0],dy=e.clientY-sw[1];sw=null;if(!P||!P.swipe||!$('#sheet').hidden)return;
  P.swipe(Math.abs(dx)<22&&Math.abs(dy)<22?'tap':Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up'))});
document.addEventListener('pointercancel',()=>{sw=null});
setInterval(()=>{const c=$('[data-clock]');if(c&&P&&P.s&&P.s.t0&&!P.s.frozen)c.textContent=mmss((Date.now()-P.s.t0)/1000)},1000);

/* ---------- word prime engine (shared by prestudy and the new-word drill) ---------- */
function Prime(words,o){const drill=o.style==='drill',zh=S.lang==='zh';
  const LAB={read:['Reading','Type the reading','info'],def:['Meaning',drill?'What does it mean?':'Choose the meaning','brand'],read2:['Reading','Type the reading again','info'],rev:['Meaning','Which word means this?','brand'],cloze:['Use',drill?'Which word fills the gap?':'Which word fits the passage?','warn']};
  const pool=Object.keys(L().words),others=(w,n)=>shuffle(pool.filter(x=>x!==w)).slice(0,n);
  function build(stage,w){
    if(stage==='read'||stage==='read2')return hasReading(w)?{w,stage,kind:'typed'}:null;
    if(stage==='def'){const c=W(w).g;return{w,stage,kind:'mc',opts:shuffle([c,...others(w,3).map(x=>W(x).g)]),correct:c,plain:1}}
    if(stage==='rev')return{w,stage,kind:'mc',opts:shuffle([w,...others(w,3)]),correct:w};
    if(stage==='cloze'){const sf=sentenceFor(w,o.test);if(!sf)return null;return{w,stage,kind:'mc',sent:sf.s.replace(sf.sf,'<span class="blank">　</span>'),full:sf.s,opts:shuffle([w,...others(w,3)]),correct:w}}}
  const pr={queue:[],i:0,per:{},words:words.slice(),tones:null,done:false,build};
  o.stages.forEach(st=>shuffle(words).forEach(w=>{const it=build(st,w);if(it)pr.queue.push(it)}));
  words.forEach(w=>pr.per[w]={exp:0,ok:0,wrong:0,idk:0,boost:0});
  if(!pr.queue.length)pr.done=true;
  function answer(ok,given,x={}){const it=pr.queue[pr.i];if(it.answered!=null)return;const idk=!!x.idk;
    Object.assign(it,{answered:idk?'':given,ok,idk,detail:x.detail||''});
    const w=pr.per[it.w]||(pr.per[it.w]={exp:0,ok:0,wrong:0,idk:0,boost:0});w.exp++;ok?w.ok++:w.wrong++;if(idk)w.idk++;learn(it.w,ok,idk);
    it.will=!ok&&(it.retries||0)<(idk?3:2);
    if(it.will)pr.queue.splice(Math.min(pr.queue.length,pr.i+(idk?2:3)+Math.floor(Math.random()*3)),0,{...it,answered:null,ok:null,idk:false,retry:true,retries:(it.retries||0)+1,will:false,boosted:false,detail:''});
    if(idk&&w.boost<2){const b=build(it.stage==='def'?'read':'def',it.w)||build('rev',it.w);if(b){b.retry=b.booster=true;pr.queue.push(b);w.boost++;it.boosted=true}}
    render()}
  function reveal(it){const w=W(it.w),isRead=it.kind==='typed',lines=[];
    const head=it.ok?(drill?'✔ Right!':'Correct.'):it.idk?(drill?'💡 Here it is — it will come back soon.':'No problem, here it is.'):(drill?'✖ Not quite.':'Not quite.');
    if(it.detail)lines.push(it.detail);
    if(isRead&&!drill)lines.push('The meaning comes next. Say the word to yourself once more first.');
    if(!isRead||drill)lines.push('Example: '+tl(w.ex));
    if(it.stage==='cloze')lines.push('Full sentence: '+tl(it.full));
    else if(!drill&&o.test){const sf=sentenceFor(it.w,o.test);if(sf)lines.push('In this passage: '+tl(sf.s.replace(sf.sf,'<b>'+sf.sf+'</b>')))}
    let follow=it.will?'You’ll see this one again in a moment.':it.ok?'':'Moving on for now.';if(it.boosted)follow+=' One extra turn for this word was added at the end.';
    if(follow)lines.push(follow);
    return `<div class="fb ${it.ok?'ok':it.idk?'idk':'no'}"><b>${head}</b><span>${tl('<b>'+it.w+'</b>')}${w.full?' · '+w.full:''}${!isRead||it.idk||drill?' — '+w.g:''}</span>${lines.map(l=>`<span class="small">${l}</span>`).join('')}</div>`}
  pr.pips=()=>`<div class="pips">${pr.queue.map((it,i)=>`<i class="${it.answered!=null?(it.ok?'c':'w'):i===pr.i?'cur':''}"></i>`).join('')}</div>`;
  pr.body=()=>{const it=pr.queue[pr.i],w=W(it.w),lab=LAB[it.stage],done=it.answered!=null;
    let h=`<div class="row between"><span class="small muted num">Item ${pr.i+1} of ${pr.queue.length}${it.retry?' · again':''}</span><span class="tag ${lab[2]}">${lab[0]}</span></div><p class="eyebrow">${lab[1]}</p>`;
    if(it.kind==='typed'){h+=`<p class="prompt big" lang="${L().bcp}">${it.w}</p>`;
      if(done)h+=`<input type="text" disabled class="${it.ok?'okv':it.idk?'idkv':'badv'}" value="${esc(it.answered)}" aria-label="Your answer">`;
      else if(pr.tones)h+=`<p class="note">Syllables right. Now pick the tones:</p>${pyParts(w.raw).map((p,j)=>`<div class="syl"><span>${p.s}</span>${[1,2,3,4,5].map(t=>`<button class="${pr.tones[j]===t?'sel':''}" data-act="pmTone" data-v="${j},${t}" aria-label="Tone ${t}">${t===5?'·':t}</button>`).join('')}</div>`).join('')}<div>${fill}</div>`;
      else h+=`<p class="hint">${zh?'Type the pinyin. Add tones as numbers or marks (mu4 tou5 / mù tou), or pick them next.':'Type the reading in kana or romaji.'}</p><input type="text" data-bind="inp" data-enter="pmCheck" data-focus value="${esc(P.s.inp||'')}" placeholder="${zh?'pinyin':'ひらがな / romaji'}" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Reading"><div>${fill}</div>`}
    else{h+=it.stage==='def'?`<p class="prompt big" lang="${L().bcp}">${it.w}</p><p class="center muted">${w.read}</p>`:it.stage==='rev'?`<p class="h1 center" style="padding-block:10px">${w.g}</p>`:`<p class="prompt" lang="${L().bcp}">${it.sent}</p>`;
      h+=opts(it.opts,i=>!done?'':it.opts[i]===it.correct?'ok':it.opts[i]===it.answered?'no':'',{plain:it.plain})}
    return h+(done?reveal(it):'')};
  pr.dock=()=>{const it=pr.queue[pr.i];if(it.answered!=null)return `<button class="btn" data-act="pmNext" data-focus>${pr.i===pr.queue.length-1?'Finish':'Next'}</button>`;
    return `<div class="row"><button class="btn ghost" data-act="pmIdk">I don’t know</button>${it.kind==='typed'?'<button class="btn" data-act="pmCheck">Check</button>':''}</div><p class="hint">“I don’t know” shows the answer, and this word comes back for extra practice.</p>`};
  pr.acts={
    pmCheck(){const it=pr.queue[pr.i];if(!it||it.kind!=='typed'||it.answered!=null)return;const v=(P.s.inp||'').trim(),raw=W(it.w).raw;
      if(pr.tones){if(pr.tones.some(t=>!t)){toast('Pick a tone for each syllable.');return}const g=gradeZh('',raw,pr.tones),given=v+' '+pr.tones.join('');pr.tones=null;answer(g.ok,given,g);return}
      if(!v){toast('Type the reading first.');return}
      if(zh){const g=gradeZh(v,raw);if(g.need){pr.tones=pyParts(raw).map(()=>0);render();return}answer(g.ok,v,g)}else{const g=gradeJa(v,raw);answer(g.ok,v,g)}},
    pmTone(v){const[j,t]=v.split(',').map(Number);pr.tones[j]=t;render()},
    pmIdk(){pr.tones=null;answer(false,'',{idk:true})},
    pick(v){const it=pr.queue[pr.i];if(!it||it.kind!=='mc'||it.answered!=null)return;const g=it.opts[+v];answer(g===it.correct,g)},
    fill(){const it=pr.queue[pr.i],raw=W(it.w).raw;if(pr.tones)pr.tones=pyParts(raw).map(p=>p.t);else P.s.inp=raw;render()},
    pmNext(){pr.i++;P.s.inp='';pr.tones=null;if(pr.i>=pr.queue.length)pr.done=true;render()}};
  pr.stats=()=>{const first=pr.queue.filter(it=>!it.retry&&it.answered!=null),ans=pr.queue.filter(it=>it.answered!=null);
    return{first:first.length,firstOk:first.filter(it=>it.ok).length,read:ans.filter(it=>it.kind==='typed').length,mean:ans.filter(it=>it.kind==='mc').length,idk:ans.filter(it=>it.idk).length}};
  return pr}

/* ---------- prestudy: Preview → Word prime (+ readiness check) → Ready; and the post-test follow-up ---------- */
function Prestudy(test,type,o={}){const follow=o.mode==='followup',zh=S.lang==='zh';
  const s={step:follow?2:1,hl:true,aids:'unknown',added:new Set(),tab:'passage',phase:'prime',pr:null,rd:null,inp:'',sum:false,over:null,first:null};
  const an=()=>analyse(test,s.added);
  const gradeR=(v,w)=>!v?false:zh?!!gradeZh(v,W(w).raw).ok:gradeJa(v,W(w).raw).ok;
  function startPrime(){const a=an(),words=follow?o.words:a.study;
    s.pr=Prime(words,{stages:follow?['read','def','cloze']:a.mode==='light'?['read','def']:['read','def','read2','rev','cloze'],test,style:'prestudy'});s.light=a.mode!=='full';s.phase='prime';s.step=2;s.sum=false;s.first=s.pr}
  function readyWords(){const q=s.first,score=w=>(q.per[w].idk||0)*10+(q.per[w].wrong||0)-pNow(w);return q.words.filter(hasReading).sort((a,b)=>score(b)-score(a)).slice(0,5)}
  function startReady(round){s.rd={round,words:readyWords(),i:0,ans:[],res:null};s.phase='ready';s.inp=''}
  function finishReady(){const R=s.rd,rows=R.words.map((w,i)=>({w,u:R.ans[i],ok:gradeR(R.ans[i],w)})),score=rows.filter(r=>r.ok).length,need=Math.ceil(rows.length*.8);
    rows.forEach(r=>learn(r.w,r.ok,!r.u));R.res={rows,score,n:rows.length,need,pass:score>=need,failed:rows.filter(r=>!r.ok).map(r=>r.w)}}
  function toReady(){s.step=3;const n=s.first?s.first.words.length:0,room=Math.min(n,3);s.over=!follow&&n>room?{fits:room,over:n-room,state:'ask'}:null}
  if(follow)startPrime();
  const steps=()=>`<div class="seg">${(follow?['Follow-up','Produce']:['Preview','Word prime','Ready']).map((n,i)=>`<button class="${(follow?(s.step===3?1:0):s.step-1)===i?'on':''}" disabled style="opacity:1">${n}</button>`).join('')}</div>`;
  const P0={s,onDone:o.onDone,skippable:!!o.daily,
   view(){const a=an(),ttl=tl(test.title),sub=(follow?'Review the words you missed':'Study first')+' · '+(type==='read'?'Reading':'Listening');
    if(s.step===1){const mode={full:['Full prestudy recommended','bad'],light:['A short prime is enough','ok'],none:['You know most of these words','ok']}[a.mode],k=a.study.length;
      const mins=a.mode==='full'?Math.round((60+k*5*8+40)/60):Math.max(1,Math.round(k*2*8/60));
      const list=a.study.map(w=>{const x=W(w),occ=toks(test).filter(t=>t.lemma===w).length;return `<button class="trow" data-act="word" data-v="${w}"><span class="dot ${status(pNow(w))}"></span><span class="mid">${tl(w)}<small>${x.read?x.read+' · ':''}${x.g}</small></span><span class="end">${s.added.has(w)?'<span class="tag warn">Added by you</span><br>':''}${inQ(test,w)?'<span class="tag brand">In a question</span><br>':''}×${occ}</span></button>`}).join('');
      return frame({title:ttl,sub,gl:L().g.study,stage:`${steps()}
        <div class="wrap"><span class="tag ${mode[1]}">${mode[0]}</span><span class="tag">${pct(a.all.filter(w=>pNow(w)<.75).length,a.all.length)}% of key words new to you</span><span class="tag">About ${mins} min</span></div>
        ${audio(1)}
        <div class="seg"><button class="${s.tab==='passage'?'on':''}" data-act="ptab" data-v="passage">Passage</button><button class="${s.tab==='words'?'on':''}" data-act="ptab" data-v="words">Key words · ${k}</button></div>
        ${s.tab==='passage'?`<div class="row between"><button class="row small" data-act="hl"><span class="sw ${s.hl?'on':''}"></span>Highlight</button><div class="seg" title="Reading aids">${[['unknown','New words'],['all','Every word'],['off','Off']].map(([v,n])=>`<button class="${s.aids===v?'on':''}" data-act="aids" data-v="${v}">${n}</button>`).join('')}</div></div>
          ${passageHTML(test,{aids:s.aids,hl:s.hl,tap:true,added:s.added})}
          <p class="small muted">${a.all.length} linked words · ${a.unknown} new · ${a.all.filter(w=>inQ(test,w)&&pNow(w)<.5).length} of those appear in a question. ${L().aid} sits above ${s.aids==='off'?'no words':s.aids==='all'?'every word':'new words only'}.</p>`
        :`<p class="small muted">${k} words to study. Tap a word in the passage to add one you don’t know.</p><div class="rowlist">${list||'<p class="note">No new words in this test for you. You can take it straight away.</p>'}</div>`}`,
        dock:`<button class="btn" data-act="startPrime">${k?'Start the word prime':'Continue'}</button><button class="link quiet center" data-act="cold">Skip and take the test</button>`})}
    if(s.step===2){let head,body,dock;const pr=s.pr;
      if(s.phase==='ready'){const R=s.rd;head=`<div class="row between"><b>Readiness check · round ${R.round}</b><span class="tag info">No feedback yet</span></div><div class="pips">${R.words.map((_,i)=>`<i class="${i<R.i?'c':i===R.i?'cur':''}"></i>`).join('')}</div>`;
        if(!R.res){const w=R.words[R.i];body=`<p class="eyebrow">Check ${R.i+1} of ${R.words.length} · Type the reading</p><p class="prompt big" lang="${L().bcp}">${w}</p><p class="hint">${zh?'Pinyin with tones (mu4 tou5 or mù tou)':'Kana or romaji'}</p><input type="text" data-bind="inp" data-enter="rdNext" data-focus value="${esc(s.inp)}" placeholder="${zh?'pinyin':'ひらがな / romaji'}" autocomplete="off" autocapitalize="off" aria-label="Reading"><div>${fill}</div>`;
          dock=`<div class="row"><button class="btn ghost" data-act="rdIdk">I don’t know</button><button class="btn" data-act="rdNext">Next</button></div>`}
        else{const r=R.res,msg=r.pass?'You’re ready for the test.':R.round===1?'One short extra round on the words you missed, then one more check.':'You can take the test anyway. Studying never blocks it.';
          body=`<div class="stats two"><div class="stat"><div class="n num">${r.score} / ${r.n}</div><small>Round ${R.round} (need ${r.need})</small></div><div class="stat"><span class="tag ${r.pass?'ok':'warn'}">${r.pass?'Ready':'Not yet'}</span><small>${msg}</small></div></div>
            <table class="tbl"><thead><tr><th>Word</th><th>You typed</th><th>Reading</th><th></th></tr></thead><tbody>${r.rows.map(x=>`<tr><td>${tl('<b>'+x.w+'</b>')}</td><td>${esc(x.u)||'—'}</td><td>${W(x.w).full}</td><td>${x.ok?'✓':'✕'}</td></tr>`).join('')}</tbody></table>`;
          dock=`<button class="btn" data-act="rdDone">${r.pass||R.round>1?'Continue':'Extra round on missed words'}</button>`}}
      else if(s.sum||pr.done){const st=pr.stats(),nx=follow?'Next: use these words yourself in a short translation.':s.phase==='boost'?'Next: one more readiness check.':s.light||!readyWords().length?'Next: you’re ready to take the test.':'Next: a quick readiness check, up to five typed readings with no feedback until the end.';
        head=`<div class="row between"><b>${s.phase==='boost'?'Extra round':follow?'Follow-up':'Word prime'}</b><span class="tag brand">${pr.words.length} words · ${pr.queue.length} items</span></div>${pr.pips()}`;
        body=pr.queue.length?`<div class="stats two"><div class="stat"><div class="n num">${st.firstOk} / ${st.first}</div><small>correct on the first try</small></div><div class="stat"><div class="n num">${st.read}</div><small>reading items</small></div><div class="stat"><div class="n num">${st.mean}</div><small>meaning and use items</small></div><div class="stat"><div class="n num">${st.idk}</div><small>“I don’t know” answers</small></div></div><p class="note">${nx}</p>`:'<p class="note">No words to prime for this test. Continue when you’re ready.</p>';
        dock=`<button class="btn" data-act="primeDone">Continue</button>`}
      else{head=`<div class="row between"><b>${s.phase==='boost'?`Extra round · ${pr.words.length} missed words`:follow?'Follow-up':'Word prime'}</b><span class="tag brand">${pr.words.length} words · ${pr.queue.length} items</span></div>${pr.pips()}`;body=pr.body();dock=pr.dock()}
      return frame({title:ttl,sub,gl:L().g.study,stage:steps()+head+body,dock})}
    const st=s.first?s.first.stats():{first:0,firstOk:0},R=s.rd&&s.rd.res,ov=s.over;
    return frame({title:ttl,sub,gl:L().g.study,stage:`${steps()}<div class="done-wm" lang="${L().bcp}">${L().g.study}</div><h1 class="h1">${follow?'Follow-up done':'Ready for the test'}</h1>
      <div class="stats"><div class="stat"><div class="n num">${s.first?s.first.words.length:0}</div><small>words studied</small></div><div class="stat"><div class="n num">${st.firstOk} / ${st.first}</div><small>correct on the first try</small></div>${R?`<div class="stat"><div class="n num">${R.score} / ${R.n}</div><small>readiness check</small></div>`:''}</div>
      <p class="small muted">Your answers were saved to your word knowledge.</p>
      ${ov?(ov.state==='ask'?`<div class="note warn col"><b>You drilled ${ov.fits+ov.over} words; today’s new-word limit has room for ${ov.fits}.</b><span>The other ${ov.over} can wait for the coming days, or start today (about +2 min a day for the next four days).</span><div class="row"><button class="btn sm ghost grow" data-act="ovQ">Queue the rest for later</button><button class="btn sm grow" data-act="ovA">Add all ${ov.over} now</button></div></div>`:`<p class="note">${ov.state==='queued'?`${ov.over} words queued for the coming days.`:`${ov.over} words added to today’s drill.`}</p>`):''}
      ${follow?`<p class="note">Now produce them: translate two to four sentences of this passage back into the language you are learning, from a reference in your language. Each primed word you use is checked.</p>`:'<p class="small muted">Your first attempt after studying counts at half weight for your rating.</p>'}`,
      dock:follow?`<button class="btn" data-act="produce">Translate a passage (about 5 min)</button><button class="btn ghost" data-act="back">${o.daily?'Back to today’s session':'Back to your results'}</button>`:`<button class="btn" data-act="take">▶ Take the test</button>`})},
   acts:{
    ptab(v){s.tab=v;render()},hl(){s.hl=!s.hl;render()},aids(v){s.aids=v;render()},
    play(){speak(text(test))},speed(){toast('Playback speed stays at 1x while you study.')},
    word(w){const x=W(w),p=pNow(w),occ=toks(test).filter(t=>t.lemma===w).length,auto=p<.75&&!s.added.has(w);
      sheet(`<div class="row" style="align-items:baseline">${tl(x.lemma,'h1')}<span class="muted">${x.read?x.read+' · ':''}${x.pos}</span></div><p style="font-size:17px">${x.g}</p><p class="muted">${tl(x.ex)}</p>
        <div class="wrap"><span class="tag ${STATUS[status(p)][1]}">${STATUS[status(p)][0]}</span><span class="tag">×${occ} in the passage</span>${inQ(test,w)?'<span class="tag brand">In a question</span>':''}${auto?'<span class="tag">In your study list</span>':''}</div>
        <div class="row">${follow||auto?'':`<button class="btn sm grow ${s.added.has(w)?'ghost':''}" data-act="addWord" data-v="${w}">${s.added.has(w)?'Remove from study':'I don’t know this — add to study'}</button>`}<button class="btn sm ghost" data-act="closeSheet">Close</button></div>`,P0.acts)},
    addWord(w){s.added.has(w)?s.added.delete(w):s.added.add(w);closeSheet();render()},
    startPrime(){if(!an().study.length){toReady();render();return}startPrime();render()},
    cold(){openTest(test,type,{daily:o.daily,onDone:r=>close(r)})},
    primeDone(){if(s.phase==='boost'){startReady(2);render();return}
      if(follow||s.light||!readyWords().length){toReady();render();return}startReady(1);render()},
    rdNext(){s.rd.ans.push((s.inp||'').trim());s.inp='';s.rd.i++;if(s.rd.i>=s.rd.words.length)finishReady();render()},
    rdIdk(){s.inp='';P0.acts.rdNext()},
    rdDone(){const r=s.rd.res;if(r.pass||s.rd.round>1){toReady();render();return}
      s.pr=Prime(r.failed,{stages:['read','def'],test,style:'prestudy'});s.phase='boost';render()},
    fill(){if(s.phase==='ready'&&!s.rd.res){s.inp=W(s.rd.words[s.rd.i]).raw;render()}else s.pr.acts.fill()},
    ovQ(){s.over.state='queued';render()},ovA(){s.over.state='added';render()},
    take(){openTest(test,type,{prestudied:true,daily:o.daily,onDone:r=>close(r)})},
    produce(){open(DT({produce:test,onDone:()=>close('done')}))},back(){close('done')}}};
  ['pmCheck','pmTone','pmIdk','pick','pmNext'].forEach(k=>P0.acts[k]=v=>s.pr&&s.pr.acts[k](v));
  return P0}

/* ---------- comprehension test (listening / reading) ---------- */
function introSheet(key){const x=INTRO[key];sheet(`<h2 class="h2">ⓘ ${x[0]}</h2><p>${x[1]}</p><p>${x[2]}</p><button class="btn" data-act="closeSheet">Got it, let’s go!</button>`)}
function openTest(t,type,o={}){open(TestPlayer(t,type,o));if(!S.introSeen[type]){S.introSeen[type]=1;introSheet(type)}}
function TestPlayer(t,type,o={}){const n=t.qs.length,SP=[1,1.25,1.5,.75],read=type==='read';
  const s={q:0,ans:{},sub:false,tab:read?'passage':'q',furi:false,t0:Date.now(),sp:0,vc:null};
  const right=()=>t.qs.filter((q,i)=>s.ans[i]===q.a).length;
  const missed=()=>[...new Set(t.qs.flatMap((q,i)=>s.ans[i]!==q.a?q.w:[]))].slice(0,5);
  function vcSheet(){const v=s.vc,w=v.words[v.i],x=W(w);
    sheet(`<div><h2 class="h2">Quick Vocab Check</h2><p class="small muted">Help us track your vocabulary!</p></div><p class="prompt big" lang="${L().bcp}">${w}</p><p class="center muted">${x.read}</p><p class="eyebrow">What does this word mean?</p>
      ${opts(v.opts,i=>v.pick==null?'':v.opts[i]===x.g?'ok':i===v.pick?'no':'',{plain:1,act:'vcPick'})}
      <div class="row between"><span class="small muted num">${v.i+1} / ${v.words.length}</span>${v.pick!=null&&v.opts[v.pick]!==x.g?'<button class="btn sm" data-act="vcNext">Next →</button>':''}<button class="link quiet" data-act="closeSheet">Skip All</button></div>`,me.acts)}
  function vcLoad(){const v=s.vc,w=v.words[v.i];v.pick=null;v.opts=shuffle([W(w).g,...shuffle(Object.keys(L().words).filter(x=>x!==w)).slice(0,3).map(x=>W(x).g)])}
  const me={s,onDone:o.onDone,
   view(){const q=t.qs[s.q],sel=s.ans[s.q],answered=Object.keys(s.ans).length,tabs=read?[['passage','Reading Passage'],['q','Questions']]:s.sub?[['q','Questions'],['passage','Transcript']]:null;
    let st=`<div class="row between"><span class="small muted num">${answered}/${n} answered</span>${S.lang==='ja'?`<button class="row small" data-act="furi" title="Furigana over kanji (halves ELO change)"><span class="sw ${s.furi?'on':''}"></span>ふりがな</button>`:''}</div>`;
    if(s.sub){const r=right(),ms=missed();st+=`<div class="note ok col"><span><b>Test submitted successfully!</b> Score: ${r}/${n} (${pct(r,n)}%)</span>${o.prestudied?'<span class="small">Prestudied: this attempt counted at half weight.</span>':''}
      ${ms.length?'<button class="btn sm" data-act="followup">Review the words you missed (about 2 min)</button>':o.prestudied?'<button class="btn sm" data-act="produce">Translate a passage from this test (about 5 min)</button>':''}</div>`}
    if(!read&&!s.sub)st+=audio(SP[s.sp]);
    if(tabs)st+=`<div class="seg">${tabs.map(([v,l])=>`<button class="${s.tab===v?'on':''}" data-act="ttab" data-v="${v}">${l}</button>`).join('')}</div>`;
    if(s.tab==='passage')st+=passageHTML(t,{aids:s.furi?'all':'off',tap:s.sub})+(s.sub?'<p class="hint">Tap any word for its definition</p>':read?'<p class="hint">Words become tappable after you submit.</p>':'');
    else st+=`<div class="qnav">${t.qs.map((x,i)=>`<button class="${i===s.q?'cur ':''}${s.sub?(s.ans[i]===x.a?'good':'bad'):s.ans[i]!=null?'ans':''}" data-act="goq" data-v="${i}" aria-label="Question ${i+1}">${i+1}</button>`).join('')}</div>
      <p class="eyebrow">Question ${s.q+1} of ${n}${sel!=null&&!s.sub?' · ✓ Answered':''}</p><h2 class="qtext" lang="${L().bcp}">${q.q}</h2>
      ${opts(q.o,i=>s.sub?(i===q.a?'ok':i===sel?'no':''):i===sel?'sel':'')}${s.sub?`<p class="note">💡 <b>Explanation:</b> ${q.why}</p>`:''}`;
    return frame({title:tl(t.title),sub:`${L().name} · ${TIERS[t.tier].split(' (')[0]} · ${read?'Reading':'Listening'}`,gl:L().g[read?'read':'listen'],
      right:`<span data-clock>${mmss((s.frozen||Date.now()-s.t0)/1000)}</span> <button class="link" data-act="intro" aria-label="About this test">ⓘ</button>`,stage:st,
      dock:`<div class="row"><button class="btn ghost icon" data-act="prev" aria-label="Previous question" ${s.tab!=='q'||s.q===0?'disabled':''}>←</button><button class="btn ghost icon" data-act="next" aria-label="Next question" ${s.tab!=='q'||s.q===n-1?'disabled':''}>→</button>${s.sub?`<button class="btn" data-act="finish">${o.daily?'→ Continue':'← Back to Test List'}</button>`:`<button class="btn ok" data-act="submit" ${answered<n?'disabled':''}>Submit Test</button>`}</div>`})},
   acts:{
    pick(v){if(s.sub)return;s.ans[s.q]=+v;render()},prev(){s.q--;render()},next(){s.q++;render()},goq(v){s.q=+v;render()},ttab(v){s.tab=v;render()},
    furi(){s.furi=!s.furi;if(s.furi)toast('Furigana on: this attempt counts at half weight.');render()},
    play(){speak(text(t),SP[s.sp])},speed(){s.sp=(s.sp+1)%SP.length;stopSpeech();render()},intro(){introSheet(type)},
    submit(){stopSpeech();s.frozen=Date.now()-s.t0;s.sub=true;s.q=0;s.tab='q';render();
      setTimeout(()=>{if(P!==me)return;s.vc={words:shuffle(linked(t)).slice(0,3),i:0};vcLoad();vcSheet()},700)},
    vcPick(v){const x=s.vc;if(x.pick!=null)return;x.pick=+v;const ok=x.opts[x.pick]===W(x.words[x.i]).g;learn(x.words[x.i],ok);vcSheet();if(ok)setTimeout(()=>{if(s.vc===x&&sheetOwner)me.acts.vcNext()},800)},
    vcNext(){const x=s.vc;x.i++;if(x.i>=x.words.length){closeSheet();toast('Thanks — your vocabulary was updated.');return}vcLoad();vcSheet()},
    word(w){const x=W(w);sheet(`<div class="row" style="align-items:baseline">${tl(x.lemma,'h1')}<span class="muted">${x.read?x.read+' · ':''}${x.pos}</span></div><p style="font-size:17px">${x.g}</p><button class="btn ghost" data-act="closeSheet">Close</button>`)},
    followup(){open(Prestudy(t,type,{mode:'followup',words:missed(),daily:o.daily}))},
    produce(){open(DT({produce:t}))},
    finish(){close('done')}}};
  return me}

/* ---------- dictation ---------- */
function dictDiff(ref,typed){const norm=x=>[...x.replace(/[\s，。、．,.!?！？「」“”]/g,'')],a=norm(ref),b=norm(typed),m=a.length,n=b.length,dp=Array.from({length:m+1},()=>Array(n+1).fill(0));
  for(let i=m-1;i>=0;i--)for(let j=n-1;j>=0;j--)dp[i][j]=a[i]===b[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  let i=0,j=0;const ops=[];while(i<m||j<n){if(i<m&&j<n&&a[i]===b[j]){ops.push(['ok',a[i]]);i++;j++}else if(j<n&&(i>=m||dp[i][j+1]>=dp[i+1][j])){ops.push(['extra',b[j]]);j++}else{ops.push(['miss',a[i]]);i++}}
  const out=[];for(let k=0;k<ops.length;k++){const x=ops[k],y=ops[k+1];if(y&&x[0]!=='ok'&&y[0]!=='ok'&&x[0]!==y[0]){out.push(['wrong',x[0]==='miss'?x[1]:y[1],x[0]==='miss'?y[1]:x[1]]);k++}else out.push(x)}
  const ok=out.filter(x=>x[0]==='ok').length;return{out,ok,total:m,pct:m?Math.round(ok/m*1000)/10:0}}
function Dictation(t,o={}){const SP=[1,.75,.5],s={plays:0,text:'',sub:false,grading:false,sp:0,t0:Date.now(),res:null};
  if(!S.introSeen.dict){S.introSeen.dict=1;setTimeout(()=>introSheet('dict'),0)}
  const me={s,onDone:o.onDone,skippable:true,

   view(){const plays=`<span class="small num" style="${s.plays>3?'color:var(--warn);font-weight:700':''}">Plays: ${s.plays}</span>`;
    if(!s.sub)return frame({title:tl(t.title),sub:`${L().name} · Dictation`,gl:L().g.dict,right:'<button class="link" data-act="intro" aria-label="About this test">ⓘ</button>',
      stage:`${audio(SP[s.sp],plays)}<p class="eyebrow">Type what you hear</p><textarea rows="6" data-bind="text" lang="${L().bcp}" placeholder="Start typing the text you hear from the audio..." aria-label="Your dictation">${esc(s.text)}</textarea><div class="row between">${fill}<span class="small muted num" id="dcount">${s.text.length} / 5000</span></div><p class="hint">Submit unlocks once the audio has played and you have typed something.</p>`,
      dock:`<button class="btn" id="dsub" data-act="submit" ${s.plays&&s.text.trim()&&!s.grading?'':'disabled'}>${s.grading?'Grading...':'Submit'}</button>`});
    const r=s.res,g=r.pct>=95?'Excellent!':r.pct>=80?'Great Job!':r.pct>=60?'Good Effort':'Keep Practicing',mult=Math.max(.5,1-.1*(s.plays-1)),elo=Math.round((r.pct>=80?12:r.pct>=60?4:-8)*mult);
    return frame({title:tl(t.title),sub:`${L().name} · Dictation`,gl:L().g.dict,stage:`<div class="score"><span class="n num" style="color:var(--${r.pct>=80?'good':r.pct>=60?'warn':'bad'})">${r.pct}%</span><div><b>${g}</b><div class="small muted">Character Accuracy</div></div></div>
      <div class="stats four"><div class="stat"><div class="n num" style="font-size:17px">${r.ok}/${r.total}</div><small>CHARS</small></div><div class="stat"><div class="n num" style="font-size:17px">${s.plays}</div><small>PLAYS</small></div><div class="stat"><div class="n num" style="font-size:17px">${mmss(s.time)}</div><small>TIME</small></div><div class="stat"><div class="n num" style="font-size:17px;color:var(--${elo<0?'bad':'good'})">${elo>0?'+':'−'}${Math.abs(elo)}</div><small>ELO${mult<1?` <span class="tag warn">${mult.toFixed(2)}× ELO</span>`:''}</small></div></div>
      <div class="wrap small"><span>Correct</span><span class="diff" style="font-size:13px"><span class="wrong">Wrong</span></span><span class="diff" style="font-size:13px"><span class="miss">Missing</span></span><span class="diff" style="font-size:13px"><span class="extra">Extra</span></span></div>
      <div class="card"><p class="diff" lang="${L().bcp}">${r.out.map(x=>x[0]==='ok'?x[1]:x[0]==='wrong'?`<span class="wrong" title="Your transcript: ${esc(x[2])}">${x[1]}</span>`:`<span class="${x[0]}">${esc(x[1])}</span>`).join('')}</p></div>`,
      dock:`<div class="row"><button class="btn ghost" data-act="retry">Retry</button><button class="btn" data-act="finish">${o.daily?'→ Continue':'All Tests'}</button></div>`})},
   acts:{play(){if(!S.playing)s.plays++;speak(text(t),SP[s.sp]);const p=$('.audio .small');if(p)p.textContent='Plays: '+s.plays;me.onInput()},speed(){s.sp=(s.sp+1)%SP.length;stopSpeech();render()},intro(){introSheet('dict')},
    fill(){s.text=L().near[t.id];if(!s.plays)s.plays=1;render()},
    submit(){s.grading=true;stopSpeech();render();setTimeout(()=>{if(P!==me)return;s.res=dictDiff(text(t),s.text);s.time=(Date.now()-s.t0)/1000;s.sub=true;render()},700)},
    retry(){Object.assign(s,{plays:0,text:'',sub:false,grading:false,t0:Date.now()});render()},finish(){close('done')}}};
  return me}

/* ---------- practice player (new-word drill, then ladder exercises) ---------- */
function Practice(o={}){const l=L(),zh=S.lang==='zh';
  const s={phase:o.drill&&o.drill.length?'drill':'ex',q:o.drillOnly?[]:l.practice.map(x=>({...x})),i:0,right:0,total:0,sel:null,checked:false,ok:false,placed:[],inp:'',flip:false,cp:{},cpLine:'',saving:false};
  const pr=s.phase==='drill'?Prime(o.drill,{stages:['read','def','read2','rev','cloze'],style:'drill'}):null;
  const n0=s.q.length;
  function mark(ok,x){s.checked=true;s.ok=ok;s.total++;if(ok)s.right++;if(x.w)learn(x.w,ok);s.cpLine='';
    if(x.cp){const c=s.cp[x.w]=s.cp[x.w]||{ok:0};if(ok)c.ok++;if(x.cp[0]===x.cp[1])s.cpLine=c.ok===x.cp[1]?`Checkpoint passed (${c.ok}/${x.cp[1]}) — this word moves up a ring.`:`Checkpoint not passed (${c.ok}/${x.cp[1]}) — a little more practice first.`}
    else if(!ok&&!x.retry)s.q.push({...x,retry:true});render()}
  const me={s,onDone:o.onDone,
   view(){const acc=s.total?pct(s.right,s.total)+'%':'';
    if(s.phase==='drill'){if(s.saving)return frame({title:'Practice',sub:'New words',gl:l.g.practice,stage:'<p class="note center" style="margin-top:40px">Saving your new words…</p>'});
      const it=pr.queue[pr.i],left=pr.words.filter(w=>pr.queue.some((x,j)=>x.w===w&&j>=pr.i)).length,need=5,got=Math.min(need,pr.per[it.w].ok);
      return frame({title:'Practice',sub:`New words — ${left} of ${pr.words.length} to go`,gl:l.g.practice,right:`${pr.i+1} / ${pr.queue.length}`,
        stage:`<div class="row between"><span class="tag ok">🌱 New word · session 1 of 4</span><span class="pips" title="Right answers needed">${Array.from({length:need},(_,k)=>`<i class="${k<got?'c':''}"></i>`).join('')}</span></div>${pr.body()}`,dock:pr.dock()})}
    if(s.phase==='end')return frame({title:'Practice',sub:'Complete',gl:l.g.practice,stage:`<div class="done-wm" lang="${l.bcp}">${l.g.practice}</div><h1 class="h1">✅ Practice complete!</h1>${pr?`<p class="muted">New-word drill done: ${pr.words.length} words.</p>`:''}
      <div class="stats two"><div class="stat"><div class="n num">${s.right}/${s.total}</div><small>Correct</small></div><div class="stat"><div class="n num">${pct(s.right,s.total)}%</div><small>Accuracy</small></div></div>`,dock:'<button class="btn" data-act="fin">Next →</button>'});
    const x=s.q[s.i],w=x.w&&W(x.w),c=s.checked;let body='',dock='';
    if(x.k==='mc'){body=`${x.p?`<p class="prompt ${x.big?'big':''}" lang="${l.bcp}">${c?x.p.replace('<u>　　</u>',`<u class="fill">${x.o[x.a]}</u>`):x.p}</p>`:''}${x.sub?`<p class="center muted small">${x.sub}</p>`:''}${x.ctx?`<p class="small muted">In this sentence: ${tl(x.ctx)}</p>`:''}${opts(x.o,i=>!c?'':i===x.a?'ok':i===s.sel?'no':'',{plain:x.plain,subs:x.os})}`}
    else if(x.k==='typed'){body=`<p class="prompt" lang="${l.bcp}">${c?x.p.replace('<u>　　</u>',`<u class="fill">${x.ans[0]}</u>`):x.p}</p><p class="muted small"><i>${x.hint}</i></p><input type="text" data-bind="inp" data-enter="check" data-focus ${c?'disabled':''} class="${c?(s.ok?'okv':'badv'):''}" value="${esc(s.inp)}" placeholder="Type the word..." lang="${l.bcp}" aria-label="Missing word">${c&&!s.ok?`<p class="small">✓ ${tl(x.ans[0])}</p>`:''}${c?'':`<div>${fill}</div>`}`;
      dock=c?'':'<button class="btn" data-act="check">Check</button>'}
    else if(x.k==='jumble'){body=`<div class="tiles slots" lang="${l.bcp}">${s.placed.length?s.placed.map(i=>`<button class="tile" data-act="unplace" data-v="${i}">${x.tiles[i]} ×</button>`).join(''):'<span class="small muted">Tap words below to build the sentence</span>'}</div><div class="tiles" lang="${l.bcp}">${x.tiles.map((t,i)=>`<button class="tile ${s.placed.includes(i)?'ghosted':''}" data-act="place" data-v="${i}">${t}</button>`).join('')}</div>${c&&!s.ok?`<p class="small">Correct order: ${tl(x.accept[0])}</p>`:''}`;
      dock=c?'':`<button class="btn" data-act="checkJ" ${s.placed.length<x.tiles.length?'disabled':''}>Check</button>`}
    else if(x.k==='spot'){body=`<div class="tiles" lang="${l.bcp}" style="padding-block:10px">${x.chips.map((t,i)=>`<button class="tile ${!c?'':i===x.a?'ok':i===s.sel?'no':''}" data-act="pick" data-v="${i}">${t}</button>`).join('')}</div>${c?`<p class="small">✓ Correct form: ${tl('<b>'+x.fix+'</b>')}</p>`:''}`}
    else if(x.k==='flash'){body=`<button class="fcard" data-act="reveal" aria-label="Reveal card">${tl(x.w)}<span class="muted">${w.read}</span>${s.flip?`<span class="back"><b>${w.g}</b><i class="muted">${tl(w.ex)}</i></span>`:''}</button>`;
      dock=c?'':s.flip?'<p class="hint">How well did you know this?</p><div class="rate two"><button class="r0" data-act="rate" data-v="0">Didn’t know</button><button class="r2" data-act="rate" data-v="1">Knew it</button></div>':'<button class="btn" data-act="reveal">👁 Reveal</button>'}
    if(c)dock=`${x.k==='flash'?'':`<div class="fb ${s.ok?'ok':'no'}"><b>${s.ok?'✔ Correct!':'✖ Incorrect'}</b><span>${x.why||''}</span>${s.cpLine?`<b class="small">${s.cpLine}</b>`:''}</div>`}<button class="btn" data-act="next" data-focus>Next →</button>`;
    if(!dock)dock='<p class="hint">Tap an answer to check it.</p>';
    return frame({title:'Practice',sub:o.extra?'Extra round':'Vocabulary practice',gl:l.g.practice,right:`${s.i+1} / ${s.q.length}${acc?' · '+acc:''}`,
      stage:`<div class="bar"><i style="width:${s.i/s.q.length*100}%"></i></div>${x.cp?`<span class="tag warn" style="align-self:flex-start">🏁 Checkpoint · ${x.cp[0]} of ${x.cp[1]}</span>`:''}
        ${w?`<div class="ribbon" lang="${l.bcp}">${!c&&(x.k==='typed'||(x.o&&x.o.includes(x.w)))?'<span class="muted">Word shown after you answer</span>':`<b>${x.w}</b><span>${!c&&x.t.includes('→')?'':w.read}</span><span class="muted">${x.k==='flash'&&!s.flip?'':w.g}</span>`}<span class="tag brand" style="margin-left:auto">L${x.lv[0]} ${x.lv[1]}</span></div>`:''}
        <div class="row"><span class="tag">${x.t}${x.retry?' · again':''}</span></div>${x.ins?`<p style="font-weight:700">${x.ins}</p>`:''}${body}`,dock})},
   acts:{
    pick(v){if(s.phase==='drill'){pr.acts.pick(v);return}const x=s.q[s.i];if(s.checked||!['mc','spot'].includes(x.k))return;s.sel=+v;mark(+v===x.a,x)},
    check(){const x=s.q[s.i],v=s.inp.trim();if(s.phase==='drill'){pr.acts.pmCheck();return}if(!v){toast('Type the word first.');return}mark(x.ans.includes(v),x)},
    fill(){if(s.phase==='drill'){pr.acts.fill();return}s.inp=s.q[s.i].ans[0];render()},
    place(v){if(!s.checked){s.placed.push(+v);render()}},unplace(v){if(!s.checked){s.placed=s.placed.filter(i=>i!==+v);render()}},
    checkJ(){const x=s.q[s.i];mark(x.accept.includes(s.placed.map(i=>x.tiles[i]).join('')),x)},
    reveal(){if(!s.flip){s.flip=true;render()}},rate(v){mark(v==='1',s.q[s.i])},
    next(){Object.assign(s,{sel:null,checked:false,placed:[],inp:'',flip:false});s.i++;if(s.i>=s.q.length)s.phase='end';render()},
    pmNext(){const last=pr.i>=pr.queue.length-1;if(last)s.saving=true;pr.acts.pmNext();if(last){setTimeout(()=>{if(P!==me)return;s.saving=false;s.phase=s.q.length?'ex':'end';s.right+=pr.stats().firstOk;s.total+=pr.stats().first;render()},800)}},
    fin(){close('done')}}};
  if(pr)['pmCheck','pmTone','pmIdk'].forEach(k=>me.acts[k]=v=>pr.acts[k](v));
  return me}

/* ---------- flashcards ---------- */
function Flashcards(o={}){const l=L(),deck=()=>Object.keys(l.words).filter(w=>pNow(w)<.9).slice(0,6);
  const s={tab:'reading',q:deck(),i:0,n:0,flip:false,counts:[0,0,0,0]};s.n=s.q.length;

          :(li?`<span class="audio" style="border:0;background:none"><span class="play" data-act="say" role="button" aria-label="Play word">▶</span></span><span class="muted">Tap to listen</span>`:`${tl(w.lemma)}<span class="muted">${w.read}</span>`)}</button>`,
      dock:s.flip?`<div class="rate">${R.map((r,i)=>`<button class="r${i}" data-act="rate" data-v="${i}">${r[0]}<small>${r[1]}</small></button>`).join('')}</div>`:'<button class="btn" data-act="flip">Flip</button>'})},
   acts:{ftab(v){Object.assign(s,{tab:v,q:deck(),i:0,flip:false,counts:[0,0,0,0]});render()},flip(){s.flip=!s.flip;render()},
    say(){stopSpeech();speak(s.q[s.i],.9)},
    rate(v){s.counts[+v]++;learn(s.q[s.i],+v>0);if(v==='0')s.q.push(s.q[s.i]);s.i++;s.flip=false;render()},fin(){close('done')}}};
  return me}

/* ---------- dual translation, guided self-repair, full feedback ---------- */

  const rp=s.rp,RUNGS=['where','kind','clue'],capChecks=o.fixOnly?3:4;

  function toAnswer(kind){rp.ans=kind;rp.scr='answer';rp.out[rp.k]=kind==='fixed'?'self':kind==='fine'?'fine':'help'}

    if(rp.scr==='summary'){const c=k=>rp.out.filter(x=>x===k).length;return fr(`<div class="done-wm" lang="${l.bcp}">${l.g.fix}</div><h1 class="h1">${o.fixOnly?'Practice done':'All done'}</h1><div class="stats"><div class="stat"><div class="n num">${c('self')}</div><small>Fixed yourself</small></div><div class="stat"><div class="n num">${c('help')+c('fine')}</div><small>Needed help</small></div><div class="stat"><div class="n num">${c('help')}</div><small>${o.fixOnly?'Back in practice later':'Saved to practice'}</small></div></div>`,'<button class="btn" data-act="rDone">Done</button>')}
    if(rp.scr==='answer')return fr(`<h2 class="h2">${rp.ans==='fine'?'Noted. Compare:':'Compare'}</h2><div class="card col"><p class="eyebrow">You wrote</p><p class="fixbox" lang="${l.bcp}" style="--x:1">${st.bad.replace(/<s>/g,'<s style="color:var(--glow-text)">')}</p><p class="small muted">${tl(d.sample[st.i])}</p></div><div class="card col"><p class="eyebrow">Answer</p><p class="fixbox" lang="${l.bcp}">${st.good.replace(/<b>/g,'<b style="text-decoration:underline">')}</p><p class="small muted">${tl(st.accept[0])}</p></div><p>${st.why}</p>`,`<button class="btn" data-act="rNext" data-focus>${rp.k===d.steps.length-1?'Finish':'Next'}</button>`);
    if(rp.scr==='fixed')return fr(`<div class="center" style="margin-top:60px"><div class="score" style="justify-content:center"><span class="n" style="color:var(--good)">✓</span></div><h1 class="h1">Fixed</h1><p class="muted" style="margin-top:6px">${o.fixOnly&&rp.hint<=1?'Without any more help':rp.hint===0?'On your own':rp.hint===1?'With 1 hint':`With ${rp.hint} hints`}</p><p class="tl" lang="${l.bcp}" style="font-size:19px;margin-top:14px">${esc(rp.edit)}</p></div>`,`<button class="btn" data-act="rNext" data-focus>${rp.k===d.steps.length-1?'Finish':'Next'}</button>`);
    const orig=d.sample[st.i],shown=rp.hint>=1?(st.where?orig.replace(st.where,`<mark>${st.where}</mark>`):orig.replace(st.after,st.after+'<span class="caret">‸</span>')):orig,more=rp.hint<RUNGS.length;
    const hintTxt=rp.hint===0?'':rp.hint===1?'Look at the underlined part.':rp.hint===2?st.kind:st.clue;
    return fr(`${o.fixOnly?'<p class="eyebrow">From your translation on Thursday</p>':''}<button class="card small muted" style="text-align:left" data-act="rRef">${esc(d.ref.split('. ')[st.i])}${d.ref.split('. ')[st.i].endsWith('.')?'':'.'}</button>
      <p class="eyebrow">✎ Fix your sentence</p><p class="fixbox" lang="${l.bcp}">${shown}</p>
      <textarea rows="2" class="${rp.shake?'shake':''}" data-bind="edit" lang="${l.bcp}" aria-label="Your sentence">${esc(rp.edit)}</textarea>

  const me={s,onDone:o.onDone,skippable:true,keepScroll:false,

        <textarea rows="4" data-bind="text" lang="${l.bcp}" placeholder="Type your translation here…" aria-label="Your translation">${esc(s.text)}</textarea><div>${fill}</div>`,
      dock:`<button class="btn" data-act="submit" ${s.grading?'disabled':''}>${s.grading?'Grading…':'Submit for feedback'}</button>`});
    const dims=[['Accuracy',3,'1 minor issue, 1 major issue'],['Understandability',4,'no issues affected this'],['Fidelity',4,'no issues affected this'],['Range',3,'judged from your whole translation']];
    const tile=(n,b,why,opt)=>`<div class="trow" style="${opt?'border-style:dashed':''}"><span class="band b${b}">${b}</span><span class="mid"><b>${n}</b><small>${opt?'Optional — style, not correctness · ':''}${why}</small></span></div>`;
    const tabs=[['overview','Scores'],['diff','Compare'],['points','Points to notice']];
    let body=s.tab==='overview'?`<div class="score"><span class="n num">3</span><div><p class="eyebrow">Overall band</p>${s.self?`<p class="small muted">You predicted: ${s.self}/4</p>`:''}</div></div><p class="eyebrow">How it scored</p><div class="rowlist">${dims.map(x=>tile(...x)).join('')}${s.nat?tile('Naturalness',3,'judged from your whole translation',1):''}</div>${s.nat?'':'<button class="link" data-act="nat">Show naturalness (optional)</button>'}`
      :s.tab==='diff'?`<p class="eyebrow">Reference vs. your translation</p><div class="card" lang="${l.bcp}">${d.diff.map(c=>c.length===1?`<span class="dcell"><span>${c[0]}</span><span>${c[0]}</span></span>`:`<span class="dcell chg"><span>${c[0]||'·'}</span><span>${c[1]||'∅'}</span></span>`).join('')}</div>
        <div class="wrap small"><span style="color:var(--good);font-weight:700">■ Reference</span><span style="color:var(--bad);font-weight:700">■ What you wrote</span></div>
        <p class="eyebrow">What worked</p><div class="wrap">${d.worked.map(w=>`<span class="tag ok">${tl(w[0])} · ${w[1].toUpperCase()}</span>`).join('')}</div>
        ${o.produce?`<p class="eyebrow">Your primed words</p><div class="scroll-x"><table class="tbl"><thead><tr><th>Word</th><th>In the passage</th><th>In yours</th><th>Status</th></tr></thead><tbody>${d.primed.map(r=>`<tr><td>${tl(r[0])}</td><td>${tl(r[1])}</td><td>${tl(r[2])}</td><td><span class="tag ${r[3]==='produced'?'ok':r[3]==='variant'?'warn':'bad'}">${r[3]==='produced'?'Produced':r[3]==='variant'?'Different form':'Missing: back tomorrow'}</span></td></tr>`).join('')}</tbody></table></div>`:''}`
      :`<div class="note"><b>Next focus: ${d.errs[1].sub}</b><br><span class="small">Targeted practice for this is coming soon.</span></div>${d.errs.map(e=>`<div class="err ${e.sev}"><div class="wrap"><span class="tag">${e.cat}</span><span class="tag brand">${e.sub}</span><span class="tag ${e.sev==='Minor'?'warn':'bad'}">${e.sev}</span><span class="tag info">${e.src}</span></div><span class="tl" lang="${l.bcp}"><s>${e.from}</s> → <span class="to">${e.to}</span></span><span>${e.rule}</span><span class="app">${e.app}</span><button class="btn sm ghost" disabled style="border-style:dashed;align-self:flex-start" title="Practice cards are coming soon">Drill this</button></div>`).join('')}`;
    return frame({title:'Dual Translation',sub:'Your feedback',gl:l.g.dt,stage:`<div class="seg">${tabs.map(([v,n])=>`<button class="${s.tab===v?'on':''}" data-act="rtab" data-v="${v}">${n}</button>`).join('')}</div>${body}`,
      dock:`<button class="btn" data-act="again">${o.onDone?'→ Continue':'Try another'}</button>`})},
   acts:{rub(){s.rub=!s.rub;render()},self(v){s.self=+v;render()},nat(){s.nat=true;render()},rtab(v){s.tab=v;render()},
    fill(){if(s.phase==='repair'){rp.edit=d.steps[rp.k].accept[0];render()}else{s.text=d.sample.join('');render()}},
    submit(){if(!s.text.trim()){toast('Write your translation before submitting.');return}s.grading=true;render();setTimeout(()=>{if(P!==me)return;s.grading=false;s.phase='repair';rp.scr='result';render()},900)},
    rStart(){toStep(0);render()},rRef(){sheet(`<p class="eyebrow">Reference</p><p style="font-size:17px">${d.ref}</p><button class="btn ghost" data-act="closeSheet">Tap to close</button>`)},
    rHint(){rp.msg='';if(rp.hint>=RUNGS.length){toAnswer('help')}else rp.hint++;rp.shake=false;render()},
    rFine(){toAnswer('fine');render()},
    rCheck(){const st=d.steps[rp.k],v=rp.edit.trim();rp.shake=false;
      if(norm(v)===norm(d.sample[st.i])){rp.msg='That’s the same sentence. Change something first.';render();return}
      if(st.accept.some(a=>norm(a)===norm(v))){rp.out[rp.k]=rp.hint>(o.fixOnly?1:0)?'help':'self';if(rp.hint<=(o.fixOnly?1:0))rp.out[rp.k]='self';rp.scr='fixed';render();const k=rp.k;setTimeout(()=>{if(P===me&&rp.scr==='fixed'&&rp.k===k)me.acts.rNext()},1600);return}
      rp.checks++;if(rp.checks>=capChecks){toAnswer('help');render();return}
      rp.msg=rp.hint<RUNGS.length?'Still not quite. Try again, or take a hint.':'Still not quite. Try again.';rp.shake=true;render()},
    rNext(){toStep(rp.k+1);render()},
    rDone(){if(o.fixOnly){close('done');return}s.phase='result';render()},
    again(){if(o.onDone){close('done');return}Object.assign(s,{phase:'write',self:null,text:'',tab:'overview',nat:false});rp.out=[];toast('Loaded another passage (same sample in this mockup).');render()}}};
  // closing the repair sheet early goes to the full result, as in the app
  me.softClose=()=>{if(s.phase==='repair'&&!o.fixOnly){s.phase='result';render();return true}return false};
  return me}

/* ---------- pinyin tone trainer (zh) ---------- */
function resultCard(title,gl,pc,label,stats,elo){const g=pc>=95?'Excellent!':pc>=80?'Great Job!':pc>=60?'Good Effort':'Keep Practicing';

    dock:`<div class="row"><button class="btn ghost" data-act="retry">Retry</button><button class="btn" data-act="fin">${RUN&&!RUN.over?'→ Continue':'All Tests'}</button></div>`})}
function PinyinTrainer(t,o={}){const l=L(),items=l.tonePassage,idx=items.map((x,i)=>Array.isArray(x)?i:-1).filter(i=>i>=0);
  const s={k:0,mist:0,t0:Date.now(),bad:-1};
