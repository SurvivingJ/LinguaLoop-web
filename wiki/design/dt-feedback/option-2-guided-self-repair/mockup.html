<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DT feedback — Option 2: Guided self-repair (mockup)</title>
<style>
/* Tokens mirror static/css/styles.css ("Still Water" + "Midnight"). */
:root{
  --on-primary:#fff;--primary:#0e7569;--primary-hover:#0a574e;--selected-bg:#ddeeea;
  --apricot-text:#a35417;--apricot-wash:#fbe9da;
  --bg-body:#f6f9f8;--bg-surface:#fff;--bg-muted:#eaf1ef;
  --text-primary:#13282b;--text-secondary:#51686a;--text-muted:#5e7375;
  --border-default:#dde7e5;--border-strong:#b9cac7;--focus-ring:rgb(14 117 105 / 25%);
  --success:#2e7d4f;--success-text:#245f3d;--success-bg:#ddefe4;
  --danger:#c24a3f;--danger-text:#9e3a31;--danger-bg:#f6e2df;
  --warning:#c28f2c;--warning-text:#7d5a10;--warning-bg:#f7ecd6;
  --info:#3b6ea8;--info-text:#2f5887;--info-bg:#e1eaf5;
  --shadow-sm:0 1px 2px rgb(19 40 43 / 5%);
  --font-sans:'Inter','Hiragino Sans','Yu Gothic UI',meiryo,'PingFang SC','Microsoft YaHei',system-ui,sans-serif;
  --font-display:'Sora',var(--font-sans);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --on-primary:#06201c;--primary:#3db3a0;--primary-hover:#5cc6b5;--selected-bg:rgb(61 179 160 / 18%);
  --apricot-text:#f0975a;--apricot-wash:rgb(240 151 90 / 16%);
  --bg-body:#0b1416;--bg-surface:#122021;--bg-muted:#18292a;
  --text-primary:#eef4f3;--text-secondary:#bcd0cd;--text-muted:#93a6a4;
  --border-default:#1f3335;--border-strong:#33494b;--focus-ring:rgb(61 179 160 / 35%);
  --success:#57a877;--success-text:#7fc79b;--success-bg:rgb(87 168 119 / 18%);
  --danger:#e0796f;--danger-text:#ec9089;--danger-bg:rgb(224 121 111 / 18%);
  --warning:#dcae54;--warning-text:#dcae54;--warning-bg:rgb(220 174 84 / 16%);
  --info:#7aa3d6;--info-text:#9bbbe2;--info-bg:rgb(122 163 214 / 18%);
  --shadow-sm:0 1px 2px rgb(0 0 0 / 40%);color-scheme:dark;
}}
:root[data-theme="dark"]{
  --on-primary:#06201c;--primary:#3db3a0;--primary-hover:#5cc6b5;--selected-bg:rgb(61 179 160 / 18%);
  --apricot-text:#f0975a;--apricot-wash:rgb(240 151 90 / 16%);
  --bg-body:#0b1416;--bg-surface:#122021;--bg-muted:#18292a;
  --text-primary:#eef4f3;--text-secondary:#bcd0cd;--text-muted:#93a6a4;
  --border-default:#1f3335;--border-strong:#33494b;--focus-ring:rgb(61 179 160 / 35%);
  --success:#57a877;--success-text:#7fc79b;--success-bg:rgb(87 168 119 / 18%);
  --danger:#e0796f;--danger-text:#ec9089;--danger-bg:rgb(224 121 111 / 18%);
  --warning:#dcae54;--warning-text:#dcae54;--warning-bg:rgb(220 174 84 / 16%);
  --info:#7aa3d6;--info-text:#9bbbe2;--info-bg:rgb(122 163 214 / 18%);
  --shadow-sm:0 1px 2px rgb(0 0 0 / 40%);color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg-body);color:var(--text-primary);font-family:var(--font-sans);font-size:16px;line-height:1.5}
:lang(zh){font-family:'PingFang SC','Microsoft YaHei','Noto Sans SC','Noto Sans CJK SC','Inter',system-ui,sans-serif}
:lang(ja){font-family:'Hiragino Sans','Yu Gothic UI',meiryo,'Noto Sans JP','Noto Sans CJK JP','Inter',system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,summary:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--focus-ring);outline-offset:2px}
.nav{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--bg-surface);border-bottom:1px solid var(--border-default)}
.brand{font-family:var(--font-display);font-weight:700;color:var(--primary);font-size:1.05rem}
.pill{font-size:.72rem;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--bg-muted);color:var(--text-secondary);white-space:nowrap}
.nav .sp{flex:1}
.nav .pill{min-width:0;overflow:hidden;text-overflow:ellipsis}
.theme-btn{border:1px solid var(--border-default);background:var(--bg-surface);border-radius:8px;padding:5px 10px;font-size:.82rem;color:var(--text-secondary)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:12px 16px 0;max-width:1120px;margin:0 auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:1px solid var(--border-default);background:var(--bg-surface);color:var(--text-secondary);border-radius:999px;padding:7px 14px;font-size:.88rem;font-weight:600;min-height:40px}
.tab[aria-selected="true"]{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
:root[data-theme="dark"] .tab[aria-selected="true"]{color:#06201c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tab[aria-selected="true"]{color:#06201c}}
.wrap{max-width:1120px;margin:0 auto;padding:16px}
.head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:4px 0 14px}
.head h1{font-family:var(--font-display);font-size:1.3rem;margin:0}
.head .sub{font-size:.85rem;color:var(--text-muted)}
.grid{display:grid;grid-template-columns:1fr;gap:16px}
@media (min-width:900px){.grid{grid-template-columns:340px minmax(0,1fr);align-items:start}.grid>.side{position:sticky;top:12px}}
.card{background:var(--bg-surface);border:1px solid var(--border-default);border-radius:14px;padding:18px 20px;box-shadow:var(--shadow-sm)}
.label{font-size:.76rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--text-muted);margin-bottom:8px}
.l1{font-size:1.05rem;line-height:1.65}
.l1 span.s{border-radius:4px;padding:1px 0}
.l1 span.s.cur{background:var(--selected-bg)}
.l1 mark,.pl1 mark{background:var(--danger-bg);color:inherit;border-bottom:2px solid var(--danger);padding:0 1px}
details.l1wrap>summary{list-style:none;cursor:pointer}
details.l1wrap>summary::-webkit-details-marker{display:none}
details.l1wrap>summary .label{display:flex;justify-content:space-between;margin-bottom:0}
details.l1wrap[open]>summary .label{margin-bottom:8px}
.statusline{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px;font-size:.88rem;color:var(--text-secondary)}
.statusline .skip{margin-left:auto;background:none;border:0;color:var(--primary);font-weight:600;font-size:.86rem;padding:8px 0;text-decoration:underline;text-underline-offset:3px}
.sent{border:1px solid var(--border-default);border-radius:12px;margin-bottom:10px;background:var(--bg-surface)}
.sent.ok{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;background:transparent}
.sent.ok .t{font-size:1.02rem;color:var(--text-secondary);flex:1;min-width:0}
.sent.ok .tag{font-size:.74rem;color:var(--text-muted);white-space:nowrap;padding-top:3px}
.num{flex:0 0 auto;width:22px;height:22px;border-radius:50%;background:var(--bg-muted);color:var(--text-secondary);font-size:.72rem;font-weight:700;display:inline-flex;align-items:center;justify-content:center;margin-top:2px}
.sent.flag{border-left:4px solid var(--warning);padding:14px 16px}
.sent.flag.meaning{border-left-color:var(--danger)}
.sent.flag.low{border:1px dashed var(--border-strong);border-left:4px dotted var(--info)}
.sent.flag.done{border-left-color:var(--success)}
.sent.flag.shown{border-left-color:var(--border-strong)}
.fh{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:.74rem;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--warning-bg);color:var(--warning-text)}
.chip.meaning{background:var(--danger-bg);color:var(--danger-text)}
.chip.low{background:var(--info-bg);color:var(--info-text)}
.chip.good{background:var(--success-bg);color:var(--success-text)}
.chip.neutral{background:var(--bg-muted);color:var(--text-secondary)}
.fh .why{font-size:.78rem;color:var(--text-muted)}
.mine{font-size:1.2rem;line-height:1.7;margin:2px 0 10px;word-break:break-word}
.mine mark{background:var(--warning-bg);color:inherit;border-bottom:3px solid var(--warning);padding:0 2px;border-radius:3px 3px 0 0}
.meaning .mine mark{background:var(--danger-bg);border-bottom-color:var(--danger)}
.ladder{display:flex;gap:4px;margin:0 0 10px;padding:0;list-style:none}
.ladder li{flex:1;text-align:center;font-size:.7rem;font-weight:600;color:var(--text-muted);padding-top:7px;border-top:4px solid var(--border-default);line-height:1.2}
.ladder li.on{border-top-color:var(--primary);color:var(--text-primary)}
.ladder li.on::before{content:"✓ ";color:var(--primary)}
.hints{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.hint{font-size:.93rem;padding:8px 12px;border-radius:8px;background:var(--bg-muted);color:var(--text-primary)}
.hint b{font-size:.72rem;text-transform:uppercase;letter-spacing:.04em;color:var(--text-muted);display:block;font-weight:700}
.hint.new{animation:pop .35s ease-out}
@keyframes pop{from{transform:translateY(-4px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.hint.new{animation:none}}
.edit{display:flex;gap:8px;align-items:stretch}
.edit textarea{flex:1;min-width:0;font:inherit;font-size:1.1rem;line-height:1.55;padding:10px 12px;border:2px solid var(--border-strong);border-radius:10px;background:var(--bg-surface);color:var(--text-primary);resize:none;outline:none}
.edit textarea:focus{border-color:var(--primary)}
.btn{border:0;border-radius:10px;padding:10px 16px;font-weight:600;font-size:.95rem;min-height:44px}
.btn.primary{background:var(--primary);color:var(--on-primary)}
:root[data-theme="dark"] .btn.primary{color:#06201c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.primary{color:#06201c}}
.btn.ghost{background:var(--bg-surface);border:1px solid var(--primary);color:var(--primary)}
.btn.quiet{background:var(--bg-muted);color:var(--text-primary)}
.btn.link{background:none;color:var(--text-secondary);padding:10px 4px;text-decoration:underline;text-underline-offset:3px;font-weight:500;font-size:.88rem}
.fb{font-size:.9rem;margin:8px 0 0;color:var(--text-secondary)}
.fb:empty{display:none}
.pl1{font-size:.86rem;color:var(--text-muted);margin:0 0 4px}
.fb.try{color:var(--warning-text)}
.fb .ico{font-weight:700;margin-right:4px}
.acts{display:flex;gap:6px 12px;flex-wrap:wrap;align-items:center;margin-top:8px}
.acts .sp{flex:1}
.cmp{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:1.08rem;line-height:1.6;margin:6px 0 8px}
.cmp dt{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--text-muted);padding-top:6px;white-space:nowrap}
.cmp dd{margin:0;word-break:break-word}
.cmp mark.a{background:var(--success-bg);color:inherit;border-bottom:2px solid var(--success);padding:0 2px}
.cmp mark.b{background:none;color:inherit;border-bottom:2px dashed var(--text-muted);padding:0 2px}
.expl{font-size:.92rem;color:var(--text-secondary);border-left:3px solid var(--primary);padding-left:10px;margin-top:6px}
.note{font-size:.82rem;color:var(--text-muted);margin-top:8px}
.summary h2{font-family:var(--font-display);font-size:1.05rem;margin:0 0 8px}
.sumrow{display:flex;gap:8px;align-items:baseline;font-size:.95rem;padding:5px 0;border-top:1px solid var(--border-default)}
.sumrow:first-of-type{border-top:0}
.sumrow .k{flex:1;min-width:0}
.sumrow .v{color:var(--text-secondary);font-size:.86rem;text-align:right}
details.rec{margin-top:12px;font-size:.82rem;color:var(--text-muted)}
details.rec summary{cursor:pointer;padding:6px 0}
details.rec pre{overflow-x:auto;background:var(--bg-muted);padding:10px;border-radius:8px;font-size:.74rem;line-height:1.45;color:var(--text-secondary);margin:6px 0 0}
.clean{text-align:center;padding:26px 20px}
.clean .big{width:52px;height:52px;border-radius:50%;background:var(--success-bg);color:var(--success-text);font-size:1.6rem;display:inline-flex;align-items:center;justify-content:center;margin-bottom:8px}
.clean h2{font-family:var(--font-display);font-size:1.15rem;margin:0 0 4px}
.clean p{margin:0 auto;color:var(--text-secondary);font-size:.93rem;max-width:46ch}
/* progress */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px}
@media (min-width:700px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--bg-surface);border:1px solid var(--border-default);border-radius:12px;padding:12px 14px}
.stat .n{font-family:var(--font-display);font-size:1.55rem;font-weight:700;line-height:1.1}
.stat .d{font-size:.8rem;color:var(--text-muted);margin-top:2px}
.pgrid{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:900px){.pgrid{grid-template-columns:1fr 1fr}}
.ptype{background:var(--bg-surface);border:1px solid var(--border-default);border-radius:14px;padding:16px 18px}
.ptype h3{margin:0;font-size:1.02rem}
.ptype .pt-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.ptype .pt-top .sp{flex:1}
.track{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;margin-bottom:4px}
.stop{position:relative;height:10px;border-radius:5px;background:var(--bg-muted)}
.stop.fill{background:var(--primary)}
.stop.was::after{content:"";position:absolute;inset:-4px auto -4px 50%;width:0;border-left:2px dashed var(--text-muted)}
.tlabels{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;font-size:.68rem;color:var(--text-muted);line-height:1.2;margin-bottom:10px}
.tlabels span.now{color:var(--text-primary);font-weight:700}
.strip{display:flex;gap:4px;align-items:center;flex-wrap:wrap;font-size:.76rem;color:var(--text-muted)}
.ep{width:24px;height:24px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:.78rem;border:1px solid var(--border-strong);color:var(--text-secondary);background:var(--bg-surface)}
.ep.h0{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.ep.h1{background:var(--selected-bg);border-color:var(--primary);color:var(--text-primary)}
.ep.hA{border-style:dashed}
.ptype .say{font-size:.9rem;color:var(--text-secondary);margin-top:10px}
.legend{font-size:.82rem;color:var(--text-muted);margin:14px 2px 0;display:flex;gap:6px 14px;flex-wrap:wrap;align-items:center}
.legend .ep{width:20px;height:20px;font-size:.7rem}
.banner{font-size:.82rem;color:var(--text-muted);padding:8px 12px;border:1px dashed var(--border-strong);border-radius:10px;margin-bottom:14px}
@media (max-width:600px){
  .wrap{padding:12px 16px}.card{padding:14px 14px}.sent.flag{padding:12px 12px}
  .mine{font-size:1.12rem}.edit{flex-direction:column}.edit .btn{width:100%}
  .ladder li{font-size:.64rem}
  .sent.ok{flex-wrap:wrap}.sent.ok .t{flex-basis:calc(100% - 40px)}.sent.ok .tag{margin-left:32px;padding-top:0}
  .nav .pill{display:none}
}
</style>
</head>
<body>
<div class="nav">
  <span class="brand">LinguaDojo</span>
  <span class="pill">Option 2 mockup · scripted re-check</span>
  <span class="sp"></span>
  <button class="theme-btn" id="themeBtn" aria-label="Toggle light/dark theme">Theme</button>
</div>
<div class="tabs" role="tablist" id="tabs"></div>
<main class="wrap" id="main"></main>

<script>
/* ---------- UI strings in the learner's L1 (en + zh shown; ja follows the same keys) ---------- */
const STR = {
  en: {
    prompt:'Translate this', yours:'Your translation', nothing:'Nothing flagged', showPrompt:'show',
    toLook:n=>`${n} to look at`, clear:n=>`${n} with nothing flagged`, skip:'Skip — show me everything',
    look:'Take another look', meaning:'Meaning differs from the prompt', maybe:'Possibly worth a look',
    likely:'The checker is fairly sure something is off here.', unsure:'The checker isn\'t sure about this one. It may be fine.',
    rungs:['Where','What kind','Clue','Answer'], hWhere:'Where', hKind:'What kind', hClue:'Clue',
    whereTxt:'It\'s in the underlined part.', whereL1:'Compare the underlined part with the highlighted part of the prompt.',
    whereLost:'Your new version moved things around, so we can\'t pinpoint it any more — the hint types below still apply.',

    same:'That\'s the same sentence. Change something, or take a hint.', still:'Still flagged. Try once more, or take the next hint.',
    still2:'Still flagged — the next hint may help.', auto:'Here\'s the answer — this one\'s worth seeing rather than guessing.',
    fixed:h=>h===0?'Fixed on your own, on a second look':h===1?'Fixed once you knew where':`Fixed with ${h} hints`,
    alt:'No issue found in your new version', altNote:'Yours differs from the original but the checker finds nothing wrong with it. Here is how the original puts it:',
    shownT:'Answer shown', disputedT:'You disagreed — not counted', disputedNote:'Fair enough. Here is the original for comparison; yours may be just as good. We\'ve sent this flag for review and left it out of your progress.',
    you:'You', orig:'Original', first:'First try', adapt:'Starting with the location shown: this type has needed it the last 3 times.',
    cmpBtn:'Compare with the original', leave:'Leave it', lowNote:'Both can work here; the original uses the highlighted word. Not counted in your progress.', lowLeft:'Left as is — not counted.',
    sumT:'Repair summary', sumNone:'Nothing to repair', full:'Continue to full comparison & score', rec:'What gets recorded (tracking model preview)',
    queue:'Added to your review queue', noqueue:'Counted as a slip — no drill', startKind:'Hints',
    cleanT:'Nothing flagged', cleanP:'The checker found no problems in any sentence. It can miss small things, so the original is below if you want to compare.',
    cleanCmp:'Compare with the original', cleanSame:'Your translation matches the original word for word.'
  },
  zh: {
    prompt:'请翻译', yours:'你的译文', nothing:'未发现问题', showPrompt:'展开',
    toLook:n=>`${n} 句需要再看看`, clear:n=>`${n} 句未发现问题`, skip:'跳过，直接看全部结果',
    look:'再看一眼', meaning:'意思和原文不一样', maybe:'可能值得再看看',
    likely:'系统比较确定这句有问题。', unsure:'系统对这一句不太确定，也可能没有问题。',
    rungs:['位置','类型','提示','答案'], hWhere:'位置', hKind:'类型', hClue:'提示',
    whereTxt:'问题在划线的部分。', whereL1:'把划线部分和中文原句里标出的部分对照一下。',
    whereLost:'你改动后的句子变化较大，无法再定位，但下面的提示仍然适用。',
    check:'再检查一次', next:['提示：在哪里？','提示：哪一类问题？','提示：给我一点线索','看答案'], show:'看答案', dispute:'我觉得我的没错',
    same:'句子没有变化。改一改，或者看一个提示。', still:'仍然有问题。再试一次，或者看下一个提示。',
    still2:'仍然有问题——下一个提示也许有帮助。', auto:'直接看答案吧——这一处与其猜，不如看一看。',
    fixed:h=>h===0?'再看一眼后自己改对了':h===1?'知道位置后自己改对了':`用了 ${h} 个提示后改对了`,
    alt:'修改后的句子未发现问题', altNote:'你的句子和原文不同，但系统没有发现问题。原文是这样说的：',
    shownT:'已显示答案', disputedT:'你不同意——不计入记录', disputedNote:'没问题。下面是原文供你对照，你的说法也可能同样好。这条标记已提交复核，不会计入你的进度。',
    you:'你的', orig:'原文', first:'第一次', adapt:'',
    cmpBtn:'和原文对照', leave:'不用了', lowNote:'', lowLeft:'',
    sumT:'修改小结', sumNone:'没有需要修改的地方', full:'继续查看完整对照和评分', rec:'记录内容（追踪模型预览）',
    queue:'已加入复习队列', noqueue:'算作笔误，不安排练习', startKind:'提示',
    cleanT:'未发现问题', cleanP:'', cleanCmp:'', cleanSame:''

/* ---------- Items: real gold-set reproductions (tests/fixtures/dt_gold). L1 prompts are illustrative. ---------- */
const has = (...xs)=>t=>xs.every(x=>x instanceof RegExp?x.test(t):t.includes(x));
const ITEMS = [
 { id:'zh', tab:'中文 · L1 English', lang:'zh', ui:'en', gold:'zh_multi_01', title:'Translate into Chinese',
   l1:['My favourite T-shirt is a very special piece of clothing.','It isn\'t an expensive brand, and it isn\'t the latest style, but it\'s my favourite of all my clothes.','This T-shirt is blue, a really true blue, and it hasn\'t faded even after many washes.','The fabric is comfortable: soft against the skin and breathable, so it doesn\'t feel hot even in summer.'],
   sents:[
    {text:'我最喜欢的T恤是一个非常特别的衣服。', ref:'我最喜欢的T恤是一件非常特别的衣服。',
     flag:{type:'measure_word', kind:'Measure word (量词)', bad:'一个', good:'一件', conf:.93, sev:'minor',
       clue:'衣服 doesn\'t take the all-purpose 个. Which measure word goes with clothes worn on the upper body?',
       expl:'件 is the measure word for upper-body clothing (一件衬衫) and also for matters (一件事). 个 is understood, but sounds off to a native reader here.',
       fix:has('一件'), alt:has(/是件/)}},

function close(f,status){ f.status=status; f.ms=f.t0?Date.now()-f.t0:0; }
function act(a,i,el){
  const it=ITEMS.find(x=>x.id===cur); if(!it) return;
  if(a==='reset'){ location.reload(); return; }
  if(a==='noop') return;
  if(a==='skipall'){ it.sents.forEach(s=>{ if(s.flag&&s.flag.status==='open') close(s.flag,s.flag.low?'lowcmp':'revealed'); }); render(); return; }
  const s=it.sents[i], f=s.flag, S=STR[it.ui];
  if(a==='lowcmp') close(f,'lowcmp');
  else if(a==='lowleave') close(f,'lowleft');
  else if(a==='show') close(f,'revealed');
  else if(a==='dispute') close(f,'disputed');
  else if(a==='hint'){ if(f.rung>=3) close(f,'revealed'); else { f.rung++; f.fresh=true; f.msg=''; } }
  else if(a==='check'){
    const t=f.draft.trim();
    if(t===f.cur){ f.msg=S.same; f.msgCls=''; }
    else { f.revs.push(t); f.cur=t; f.draft=t;
      if(t===s.ref||f.fix(t)) close(f,'fixed');
      else if(f.alt&&f.alt(t)) close(f,'alt');
      else { f.tries++; if(f.tries>=4){ close(f,'revealed'); } else { f.msg=f.tries>=2?S.still2:S.still; f.msgCls='try'; } }
    }
  }
  render();
  if(f.status==='open'){ const ta=document.querySelector(`textarea[data-i="${i}"]`); if(ta&&a==='check'){ ta.focus({preventScroll:true}); ta.setSelectionRange(ta.value.length,ta.value.length);} }
}

      <p class="say" style="margin-top:0">There's no rule to hint at for most of these, so we show you the original's wording straight away and add the useful ones to vocabulary review. 9 seen this month.</p></section>
