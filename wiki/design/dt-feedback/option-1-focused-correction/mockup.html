<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DT Focused Correction</title>
<style>
/* Layout: one reading column (the app's 760px DT column) holding a single
   "fix this first" card above the full passage; a quiet rail for focus areas
   at desktop width that drops under the column on phones. */
:root {
  --bg: #f6f9f8; --surface: #fff; --surface-2: #eaf1ef;
  --ink: #13282b; --ink-2: #51686a; --ink-3: #5e7375;
  --line: #dde7e5; --line-2: #b9cac7;
  --teal: #0e7569; --teal-deep: #0a574e; --teal-wash: #ddeeea; --on-teal: #fff;
  --fix: #a35417; --fix-line: #c9661f; --fix-wash: #fbe9da;
  --ok: #245f3d; --ok-wash: #ddefe4;
  --maybe: #3b5f8f; --maybe-wash: #e1eaf5;
  --shadow: 0 1px 2px rgb(19 40 43 / 5%), 0 4px 14px rgb(19 40 43 / 6%);
  --sans: 'Inter', 'Hiragino Sans', 'Yu Gothic UI', Meiryo, 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
  --display: 'Sora', 'Inter', system-ui, sans-serif;
  --ja: 'Hiragino Sans', 'Yu Gothic UI', 'Noto Sans JP', 'Noto Sans CJK JP', Meiryo, sans-serif;
  --zh: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Noto Sans CJK SC', sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0b1416; --surface: #122021; --surface-2: #18292a;
  --ink: #eef4f3; --ink-2: #bcd0cd; --ink-3: #93a6a4;
  --line: #1f3335; --line-2: #33494b;
  --teal: #3db3a0; --teal-deep: #5cc6b5; --teal-wash: rgb(61 179 160 / 16%); --on-teal: #06211d;
  --fix: #f0a66f; --fix-line: #f0975a; --fix-wash: rgb(240 151 90 / 15%);
  --ok: #7cc79a; --ok-wash: rgb(87 168 119 / 16%);
  --maybe: #9dbde6; --maybe-wash: rgb(122 163 214 / 16%);
  --shadow: 0 1px 2px rgb(0 0 0 / 40%);
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0b1416; --surface: #122021; --surface-2: #18292a;
  --ink: #eef4f3; --ink-2: #bcd0cd; --ink-3: #93a6a4;
  --line: #1f3335; --line-2: #33494b;
  --teal: #3db3a0; --teal-deep: #5cc6b5; --teal-wash: rgb(61 179 160 / 16%); --on-teal: #06211d;
  --fix: #f0a66f; --fix-line: #f0975a; --fix-wash: rgb(240 151 90 / 15%);
  --ok: #7cc79a; --ok-wash: rgb(87 168 119 / 16%);
  --maybe: #9dbde6; --maybe-wash: rgb(122 163 214 / 16%);
  --shadow: 0 1px 2px rgb(0 0 0 / 40%);
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.6 var(--sans); }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; border-radius: 4px; }
[hidden] { display: none !important; }

/* Demo chrome (not part of the product UI) */
.demo { background: var(--surface-2); border-bottom: 1px solid var(--line); }
.demo-in { max-width: 1120px; margin: 0 auto; padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
.demo-tag { font-size: .72rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
.tabs { display: flex; gap: 6px; overflow-x: auto; flex: 1 1 300px; min-width: 0; padding: 2px; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { white-space: nowrap; border: 1px solid var(--line-2); background: var(--surface); border-radius: 999px; padding: 5px 12px; font-size: .82rem; color: var(--ink-2); min-height: 34px; }
.tab[aria-selected="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); font-weight: 600; }
.theme { border: 1px solid var(--line-2); background: var(--surface); border-radius: 999px; padding: 5px 12px; font-size: .82rem; min-height: 34px; }
.demo-note { flex-basis: 100%; font-size: .78rem; color: var(--ink-3); margin: 0; }

.page { max-width: 1120px; margin: 0 auto; padding-block: 20px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; }
@media (min-width: 1000px) { .page { grid-template-columns: minmax(0, 720px) minmax(0, 1fr); gap: 32px; align-items: start; } .page.solo { grid-template-columns: minmax(0, 760px); justify-content: center; } }
.col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }

.head { display: flex; align-items: center; gap: 12px; }
.head h1 { font: 700 1.3rem/1.2 var(--display); margin: 0; }
.back { color: var(--ink-3); font-size: 1.2rem; text-decoration: none; }
.head .step { margin-left: auto; font-size: .82rem; color: var(--ink-3); font-variant-numeric: tabular-nums; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px 22px; box-shadow: var(--shadow); min-width: 0; }
.label { font-size: .76rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
:lang(zh) .label, :lang(ja) .label { letter-spacing: .02em; font-size: .8rem; }

/* Outcome line: words, not a band wall */
.outcome { display: flex; gap: 12px; align-items: flex-start; }
.outcome .glyph { flex: none; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; }
.glyph.g-fix { background: var(--fix-wash); color: var(--fix); }
.glyph.g-ok { background: var(--ok-wash); color: var(--ok); }
.glyph.g-maybe { background: var(--maybe-wash); color: var(--maybe); }
.outcome h2 { font: 700 1.12rem/1.3 var(--display); margin: 2px 0 2px; text-wrap: balance; }
.outcome p { margin: 0; color: var(--ink-2); font-size: .92rem; }

/* L2 text */
.l2 { font-size: 1.22rem; line-height: 1.75; overflow-wrap: anywhere; }
.l2:lang(ja) { font-family: var(--ja); line-height: 2; line-break: strict; }
.l2:lang(zh) { font-family: var(--zh); line-height: 2; line-break: strict; }
.l2:lang(en) { font-size: 1.14rem; }

/* Marks: shape carries the meaning, colour only reinforces it */
.mk { border: 0; background: none; padding: 0 1px; font: inherit; color: inherit; border-radius: 3px; text-decoration-line: underline; text-underline-offset: .28em; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
.mk-fix { text-decoration-style: solid; text-decoration-thickness: 3px; text-decoration-color: var(--fix-line); background: var(--fix-wash); font-weight: 600; }
.mk-more { text-decoration-style: solid; text-decoration-thickness: 1.5px; text-decoration-color: var(--fix-line); }
.mk-maybe { text-decoration-style: dotted; text-decoration-thickness: 2.5px; text-decoration-color: var(--maybe); }
.mk-var { text-decoration-style: dashed; text-decoration-thickness: 1.5px; text-decoration-color: var(--ok); }
.mk-good { text-decoration-style: solid; text-decoration-thickness: 3px; text-decoration-color: var(--teal); background: var(--teal-wash); font-weight: 600; cursor: default; }
.mk-gap { text-decoration: none; color: var(--fix); font-weight: 700; padding: 0 2px; }
.mk sup, .gapmark sup { font: 700 .62em/1 var(--sans); margin-left: 1px; vertical-align: super; text-decoration: none; display: inline-block; }
.mk-fix sup, .mk-more sup { color: var(--fix); } .mk-maybe sup { color: var(--maybe); } .mk-var sup { color: var(--ok); }

/* Fix-first card */
.fix { border-color: var(--fix-line); border-width: 1.5px; }
.fix.is-maybe { border-color: var(--maybe); }
.fix-top { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: .76rem; font-weight: 700; padding: 3px 10px; border-radius: 999px; }
.pill-fix { background: var(--fix-wash); color: var(--fix); }
.pill-maybe { background: var(--maybe-wash); color: var(--maybe); }
.pill-focus { background: var(--teal-wash); color: var(--teal-deep); }
.pill-plain { background: var(--surface-2); color: var(--ink-2); }
.pair { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 14px; align-items: baseline; }
.pair dt { font-size: .76rem; font-weight: 700; color: var(--ink-3); white-space: nowrap; padding-top: .5em; }
.pair dd { margin: 0; min-width: 0; }
.pair .l1 { font-size: .92rem; color: var(--ink-2); }
.why { margin: 16px 0 0; font-size: 1rem; }
.why b { font-weight: 700; }
.more-why { margin-top: 10px; }
.link { border: 0; background: none; padding: 6px 0; color: var(--teal); font-weight: 600; font-size: .88rem; text-decoration: underline; text-underline-offset: 3px; min-height: 36px; }
.extra { margin: 6px 0 0; padding: 10px 12px; border-radius: 10px; background: var(--surface-2); font-size: .92rem; color: var(--ink-2); }
.extra small { display: block; color: var(--ink-3); font-size: .74rem; margin-top: 4px; }

.next { margin-top: 18px; padding-top: 16px; border-top: 1px dashed var(--line-2); display: flex; flex-direction: column; gap: 10px; }
.next-h { font-weight: 700; font-size: .95rem; }
.next-h span { color: var(--teal); }
.retype { width: 100%; min-height: 84px; resize: vertical; padding: 12px 14px; border: 2px solid var(--line-2); border-radius: 12px; background: var(--surface); color: var(--ink); font-size: 1.12rem; line-height: 1.7; }
.retype:lang(ja) { font-family: var(--ja); } .retype:lang(zh) { font-family: var(--zh); } .retype:lang(en) { font-family: var(--sans); font-size: 1.05rem; }
.retype:focus { border-color: var(--teal); outline: none; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.btn { border: 0; border-radius: 12px; padding: 12px 18px; font-weight: 600; min-height: 46px; }
.btn-p { background: var(--teal); color: var(--on-teal); }
.btn-p:hover { background: var(--teal-deep); }
.btn-s { background: var(--surface); border: 1px solid var(--line-2); color: var(--ink); }
.btn-wide { flex: 1 1 200px; }
.msg { font-size: .92rem; margin: 0; }
.msg.good { color: var(--ok); font-weight: 600; }
.msg.again { color: var(--fix); }
.dispute { margin-top: 4px; font-size: .84rem; color: var(--ink-3); }
.withdrawn { padding: 14px; border-radius: 12px; background: var(--surface-2); color: var(--ink-2); font-size: .95rem; }

/* Whole passage */
.sents { list-style: none; margin: 12px 0 0; padding: 0; display: flex; flex-direction: column; }
.sent { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 4px 8px; padding: 12px 0; border-top: 1px solid var(--line); }
.sent:first-child { border-top: 0; padding-top: 2px; }
.sent .n { font: 600 .78rem/1 var(--sans); color: var(--ink-3); padding-top: .95em; font-variant-numeric: tabular-nums; }
.sent .body { min-width: 0; }
.sent .ref { margin-top: 6px; padding: 8px 12px; border-radius: 10px; background: var(--surface-2); }
.sent .ref .l2 { font-size: 1.08rem; }
.sent .ref .l1 { font-size: .86rem; color: var(--ink-2); margin-top: 2px; }
.sent-tools { display: flex; flex-wrap: wrap; gap: 2px 16px; }
.sent-tools .link { font-size: .8rem; font-weight: 500; color: var(--ink-3); padding: 4px 0; min-height: 32px; }
.note { margin-top: 6px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); font-size: .92rem; display: flex; flex-direction: column; gap: 6px; }
.note .forms { font-size: 1rem; }
.note .forms s { text-decoration-thickness: 1px; color: var(--ink-2); }
.note .forms b { color: var(--teal-deep); }
.note .choice { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line-2); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: .84rem; min-height: 36px; }
.chip[aria-pressed="true"] { background: var(--teal-wash); border-color: var(--teal); color: var(--teal-deep); font-weight: 600; }
.moretoggle { width: 100%; margin-top: 12px; display: flex; align-items: center; gap: 10px; text-align: left; border: 1px dashed var(--line-2); background: none; border-radius: 12px; padding: 12px 14px; font-size: .92rem; min-height: 48px; }
.moretoggle .chev { margin-left: auto; transition: transform .15s; color: var(--ink-3); }
.moretoggle[aria-expanded="true"] .chev { transform: rotate(180deg); }
.moretoggle small { display: block; color: var(--ink-3); font-size: .8rem; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 12px; font-size: .8rem; color: var(--ink-3); }
.legend .mk { cursor: default; color: var(--ink); }
.honest { font-size: .82rem; color: var(--ink-3); margin: 12px 0 0; }
.missform { margin-top: 6px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; display: flex; flex-direction: column; gap: 8px; font-size: .9rem; }
.missform input { width: 100%; padding: 10px 12px; border: 1px solid var(--line-2); border-radius: 10px; background: var(--surface); color: var(--ink); font: inherit; }

/* Focus areas (rail + progress view) */
.rail { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
@media (min-width: 1000px) { .rail { position: sticky; top: 16px; } }
.rail h3 { font: 700 1rem/1.3 var(--display); margin: 4px 0 2px; }
.rail p { margin: 0; font-size: .86rem; color: var(--ink-2); }
.fa { display: flex; flex-direction: column; gap: 6px; padding: 12px 0; border-top: 1px solid var(--line); }
.fa-name { font-weight: 600; font-size: .95rem; }
.fa-name span { font-weight: 400; color: var(--ink-3); font-size: .82rem; }
.fa-meta { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: .8rem; color: var(--ink-3); }
.dots { display: flex; gap: 5px; align-items: center; flex-wrap: wrap; }
.dot { width: 13px; height: 13px; flex: none; display: inline-block; position: relative; }
.dot.hit { border-radius: 50%; background: var(--teal); }
.dot.miss { border: 2px solid var(--fix-line); border-radius: 3px; }
.dot.miss::after { content: ""; position: absolute; left: 1px; right: 1px; top: 50%; height: 2px; margin-top: -1px; background: var(--fix-line); transform: rotate(-45deg); }
.dot.unsure { border-radius: 50%; border: 2px dotted var(--ink-3); }
.dot.new { outline: 2px solid var(--ink); outline-offset: 2px; }
.st { font-size: .74rem; font-weight: 700; padding: 2px 9px; border-radius: 999px; white-space: nowrap; }
.st-work { background: var(--fix-wash); color: var(--fix); }
.st-fade { background: var(--maybe-wash); color: var(--maybe); }
.st-done { background: var(--ok-wash); color: var(--ok); }

.prog-h { font: 700 1.5rem/1.2 var(--display); margin: 0 0 4px; text-wrap: balance; }
.prog-sub { color: var(--ink-2); margin: 0; max-width: 60ch; }
.week { display: flex; flex-wrap: wrap; gap: 8px 28px; }
.week div { font-size: .88rem; color: var(--ink-2); }
.week b { display: block; font: 700 1.5rem/1.2 var(--display); color: var(--ink); font-variant-numeric: tabular-nums; }
.area { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
.area + .area { margin-top: 18px; padding-top: 18px; border-top: 1px solid var(--line); }
.area-top { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
.area-top h3 { font: 700 1.08rem/1.3 var(--display); margin: 0; flex: 1 1 220px; min-width: 0; }
.area .eg { font-size: 1.02rem; color: var(--ink-2); }
.area .eg b { color: var(--teal-deep); }
.strip { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; }
.strip .cap { font-size: .8rem; color: var(--ink-3); }
.area .rule { font-size: .9rem; color: var(--ink-2); margin: 0; }
.keylist { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: .8rem; color: var(--ink-3); margin-top: 14px; }
.keylist span { display: inline-flex; gap: 6px; align-items: center; }
.plainlist { list-style: none; margin: 10px 0 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.plainlist li { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; font-size: .94rem; }
.plainlist small { color: var(--ink-3); }
details.quiet > summary { cursor: pointer; font-weight: 600; font-size: .92rem; color: var(--ink-2); min-height: 32px; }
@media (max-width: 600px) { .card { padding: 16px; } .l2 { font-size: 1.14rem; } .l2:lang(en) { font-size: 1.06rem; } .pair { grid-template-columns: minmax(0, 1fr); gap: 0; } .pair dt { padding-top: 8px; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="demo">
  <div class="demo-in">
    <span class="demo-tag">Mockup states</span>
    <div class="tabs" role="tablist" id="tabs"></div>
    <button class="theme" id="themeBtn" type="button">Theme: auto</button>
    <p class="demo-note" id="demoNote"></p>
  </div>
</div>
<main class="page" id="page"></main>

function dotsHtml(d, add) {

  h += '<section class="card"><p class="prog-h">Three things you are working on.</p><p class="prog-sub">Each mark below is one time the pattern came up in a passage you translated. Older marks are on the left.</p>';
  h += '<div class="week" style="margin-top:16px"><div><b>12</b>passages this week</div><div><b>9</b>fix-firsts corrected</div><div><b>1</b>area resolved</div></div></section>';

  h += '<section class="card"><div class="label">Working on now</div><div style="margin-top:14px">';
  h += '<div class="area"><div class="area-top"><h3>を・に・が: which particle the verb takes</h3><span class="st st-work">Working on it</span></div>';
  h += '<div class="eg l2" lang="ja" style="font-size:1.05rem"><s>手が動かす</s> → <b>手を動かす</b></div>';
  h += '<div class="strip">' + dotsHtml('mhmhhmhhmh') + '<span class="cap">6 of the last 10 chances came out right</span></div>';
  h += '<p class="rule">Before you write a verb, ask what it acts on. That word usually takes を.</p>';
  h += '<div class="row"><button type="button" class="btn btn-p">Practise 3 sentences</button><button type="button" class="link" data-act="pause">Pause this area</button></div></div>';

  h += '<div class="area"><div class="area-top"><h3>です・ます all the way through</h3><span class="st st-work">Working on it</span></div>';
  h += '<div class="eg l2" lang="ja" style="font-size:1.05rem"><s>部品が必要だ</s> → <b>部品が必要です</b></div>';
  h += '<div class="strip">' + dotsHtml('hmhhh') + '<span class="cap">New this week. 5 chances so far.</span></div>';
  h += '<p class="rule">If the passage starts polite, keep every sentence ending polite.</p></div>';

  h += '<div class="area"><div class="area-top"><h3>は or が inside a describing clause</h3><span class="st st-fade">Fading</span></div>';
  h += '<div class="eg l2" lang="ja" style="font-size:1.05rem"><s>部品はセットになったもの</s> → <b>部品がセットになったもの</b></div>';
  h += '<div class="strip">' + dotsHtml('mhhhuhhhhh') + '<span class="cap">Right 8 times running. 2 more passages on different days and this is resolved.</span></div></div>';
  h += key + '</div></section>';

  h += '<section class="card"><div class="label">Resolved</div><ul class="plainlist">';
  h += '<li><span class="st st-done">✓ Resolved</span> <span lang="ja">見つけれる → 見つけられる</span> (dropping ら) <small>28 Oct · came out right 9 times across 4 days</small></li>';
  h += '<li><span class="st st-done">✓ Resolved</span> Counters (<span lang="ja">本・枚・個</span>) <small>11 Oct</small></li></ul>';
  h += '<p class="honest">If a resolved pattern shows up again twice, it quietly returns to your focus areas.</p></section>';

  h += '<section class="card"><details class="quiet"><summary>Seen once or twice (not tracked yet)</summary><ul class="plainlist">';
  h += '<li>Word choice <small>2 passages, different words each time</small></li><li>A word left out <small>1 passage</small></li><li>Mistakes you spotted yourself <small>3 notes</small></li></ul>';
  h += '<p class="honest">One-off slips are normal. Something becomes a focus area only when it comes up in two different passages.</p></details></section>';
  h += '<p class="honest" style="max-width:62ch">The checker reliably catches the mistakes that matter but misses some small ones, so read these strips as a trend, not an exact count.</p>';
  h += '</div>';
  return h;
}

function render() {
  var sc = scene();
  document.documentElement.lang = sc.ui === 'zh' ? 'zh-Hans' : 'en';
  document.getElementById('demoNote').textContent = sc.note;
  page.className = 'page' + (sc.id === 'progress' ? ' solo' : '');
  page.innerHTML = sc.id === 'progress' ? progressView() : resultView(sc);
  Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (b) { b.setAttribute('aria-selected', b.dataset.id === state.scene); });
}
function reset(id) { state = { scene: id, more: false, open: {}, origOpen: {}, withdrawn: false, retype: null, extra: false, maybe: {}, miss: {} }; }

var tabs = document.getElementById('tabs');
SCENES.forEach(function (s) {
  var b = document.createElement('button'); b.type = 'button'; b.className = 'tab'; b.setAttribute('role', 'tab'); b.dataset.id = s.id; b.textContent = s.tab;
  b.addEventListener('click', function () { reset(s.id); render(); window.scrollTo(0, 0); });
  tabs.appendChild(b);
});

page.addEventListener('click', function (ev) {
  var t = ev.target.closest('[data-act],[data-err]'); if (!t) return;
  var sc = scene(), act = t.dataset.act, keep = document.getElementById('retype');
  if (keep) state.retypeText = keep.value;
  if (t.dataset.err && !act) {
    var e = sc.errs[t.dataset.err];
    if (e.kind === 'fix' || e.kind === 'maybefix') { var f = document.getElementById('fixh'); if (f) f.scrollIntoView({ block: 'center', behavior: 'smooth' }); return; }
    state.open[t.dataset.err] = !state.open[t.dataset.err];
  } else if (act === 'more') {
    state.more = !state.more;
    Object.keys(sc.errs).forEach(function (k) { if (sc.errs[k].kind === 'more' || sc.errs[k].kind === 'maybe') state.open[k] = state.more; });
  } else if (act === 'orig') { state.origOpen[t.dataset.i] = !state.origOpen[t.dataset.i]; }
  else if (act === 'extra') { state.extra = !state.extra; }
  else if (act === 'dispute') { state.withdrawn = true; }
  else if (act === 'undo') { state.withdrawn = false; }
  else if (act === 'maybe') { state.maybe[t.dataset.id] = Number(t.dataset.v); }
  else if (act === 'miss') { state.miss[t.dataset.i] = state.miss[t.dataset.i] ? null : 'open'; }
  else if (act === 'missSave') { state.miss[t.dataset.i] = 'saved'; }
  else if (act === 'goProgress') { reset('progress'); window.scrollTo(0, 0); }
  else if (act === 'check') {
    var id = Object.keys(sc.errs).filter(function (k) { return sc.errs[k].kind === 'fix'; })[0], e2 = sc.errs[id];
    var v = (state.retypeText || '');
    state.retype = (v.indexOf(e2.must) >= 0 && (!e2.mustNot || v.indexOf(e2.mustNot) < 0)) ? 'ok' : 'no';
  } else { return; }
  render();
});

var themes = [null, 'light', 'dark'], ti = 0, tb = document.getElementById('themeBtn');
tb.addEventListener('click', function () {
  ti = (ti + 1) % 3;
  if (themes[ti]) document.documentElement.setAttribute('data-theme', themes[ti]); else document.documentElement.removeAttribute('data-theme');
  tb.textContent = 'Theme: ' + (themes[ti] || 'auto');
});
var q = /[?&]scene=([a-z]+)/.exec(location.search); if (q) reset(q[1]);
var qt = /[?&]theme=(dark|light)/.exec(location.search); if (qt) { document.documentElement.setAttribute('data-theme', qt[1]); tb.textContent = 'Theme: ' + qt[1]; }
if (/[?&]more=1/.test(location.search)) { state.more = true; var s0 = scene(); Object.keys(s0.errs || {}).forEach(function (k) { if (s0.errs[k].kind === 'more' || s0.errs[k].kind === 'maybe') state.open[k] = true; }); }
render();
})();
</script>
